              if actual != expected:
                  raise SystemExit(f'Hash inválido {rel}: {actual} != {expected}')
              path = Path(rel)
              if path.exists():
                  current = hashlib.sha256(path.read_bytes()).hexdigest()
                  if current == expected:
                      print(f'✓ {rel} ya estaba actualizado')
