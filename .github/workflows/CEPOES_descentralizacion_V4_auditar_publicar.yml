      - name: Contrato estatico del rediseño
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/site-overlay/assets/descentralizacion-observatorio.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          page = Path('deploy/site-overlay/presupuesto/descentralizacion/index.html').read_text(encoding='utf-8')
          js = Path('deploy/site-overlay/assets/descentralizacion-observatorio.js').read_text(encoding='utf-8')
          parser = HTMLParser(); parser.feed(page); parser.close()
          required_page = [
              'Descentralización: cuánto administran las Comunas',
              'id="commune-map"', 'id="ranking"', 'id="selected-title"',
              'Ver competencias transferidas y pendientes',
              'Ver matriz completa de transparencia de las 15 Comunas',
              'https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js',
              '/assets/descentralizacion-observatorio.js',
          ]
          required_js = [
              'descentralizacion-comunas.json', 'descentralizacion-transparencia-2024.json',
              'descentralizacion-competencias.json', 'comunas.geojson',
              'Crédito vigente administrado', 'Ejecución acumulada',
              'Modificación respecto del sancionado', "$('#content-body').hidden = false",
          ]
          for token in required_page:
              assert token in page, f'Falta en HTML: {token}'
          for token in required_js:
              assert token in js, f'Falta en JS: {token}'
          ids = re.findall(r'\bid="([^"]+)"', page)
          assert len(ids) == len(set(ids)), 'IDs duplicados en la página'
          assert 'mapa de suicidios' not in page.lower()
          print('✓ contrato HTML/JS V4')
          PY

      - name: Auditoria estatica integral del repositorio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, py_compile, xml.etree.ElementTree as ET
          for path in Path('.').rglob('*.py'):
              py_compile.compile(str(path), doraise=True)
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          ET.parse('deploy/site-overlay/sitemap.xml')
          print('✓ Python, JSON y sitemap')
          PY
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -print0)
          for f in verificar_descentralizacion_comunas.py verificar_presupuesto.py verificar_presupuesto_analitico.py verificar_presupuesto_historico.py verificar_presupuesto_territorial.py; do
            timeout 300 python "$f"
          done
          git diff --check
          echo '✓ auditoría estática integral superada'

      - name: Verificar acceso SFTP
        shell: bash
        run: |
          set -euo pipefail
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD REMOTE_DIR; do
            [ -n "${!v:-}" ] || { echo "Falta $v" >&2; exit 1; }
          done
          echo "SFTP_PORT=${SFTP_PORT:-65002}" >> "$GITHUB_ENV"
          timeout 20 bash -c "cat < /dev/null > /dev/tcp/$SFTP_HOST/${SFTP_PORT:-65002}"

      - name: Instalar cliente SFTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Construir sobre copia real de produccion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _rollback _audit_site
          mkdir -p _rollback _audit_site
          for intento in 1 2 3; do
            rm -rf _rollback/* _rollback/.[!.]* _rollback/..?* 2>/dev/null || true
            if lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 4
          set net:timeout 30
          mirror --verbose --parallel=1 "$REMOTE_DIR" _rollback
          bye
          EOF
            then break; fi
            [ "$intento" -lt 3 ] || { echo 'No se pudo espejar producción' >&2; exit 32; }
            sleep $((intento*5))
          done
          test -s _rollback/index.html
          cp -a _rollback/. _audit_site/
          cp -a deploy/site-overlay/. _audit_site/
          if [ -s deploy/delete-paths.txt ]; then
            while IFS= read -r rel; do
              rel="${rel%%#*}"; rel="$(echo "$rel" | xargs)"; [ -z "$rel" ] && continue
              case "$rel" in /*|*".."*) echo "Ruta de borrado no permitida: $rel" >&2; exit 1;; esac
              rm -rf -- "_audit_site/$rel"
            done < deploy/delete-paths.txt
          fi
          python deploy/preparar_sitio_publico.py _audit_site
          python validar_sitio_despliegue.py _audit_site

      - name: Auditoria especifica del build real
        shell: bash
        run: |
          set -euo pipefail
          node --check _audit_site/assets/descentralizacion-observatorio.js
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('_audit_site')
          page = (root/'presupuesto/descentralizacion/index.html').read_text(encoding='utf-8')
          hub = (root/'presupuesto/index.html').read_text(encoding='utf-8')
          assert page.count('<nav class="site-nav">') == 1
          assert page.count('<footer class="footer">') == 1
          assert 'class="active" href="/presupuesto/descentralizacion/"' in page
          assert 'href="/presupuesto/descentralizacion/"' in hub
          for token in ['id="commune-map"', 'id="selected-title"', 'id="matrix-body"', 'id="competencias"', '/assets/site.css', '/assets/common.js']:
              assert token in page, token
          for name in ['descentralizacion-comunas.json','descentralizacion-transparencia-2024.json','descentralizacion-competencias.json']:
              json.loads((root/'assets/data'/name).read_text(encoding='utf-8'))
          js = (root/'assets/descentralizacion-observatorio.js').read_text(encoding='utf-8')
          assert "GEO_COMUNAS" in js and "renderDetail(1)" in js
          assert re.search(r'<link\b[^>]*rel=["\']canonical["\'][^>]*cepoes\.org/presupuesto/descentralizacion/', page)
          print('✓ build real integrado y validado')
          PY

      - name: Commit solo despues de todas las auditorias
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cepoes-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy/site-overlay/presupuesto/descentralizacion/index.html \
                  deploy/site-overlay/assets/descentralizacion-observatorio.js \
                  validar_sitio_despliegue.py \
                  deploy/site-overlay/sitemap.xml \
                  deploy/site-overlay/sitemap.txt
          if git diff --cached --quiet; then
            echo 'Sin cambios: V4 ya estaba aplicada.'
          else
            git commit -m 'feat: cerrar observatorio de descentralizacion con mapa comunal [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publicar build auditado
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          mirror -R --verbose --parallel=2 --no-perms --no-umask _audit_site "$REMOTE_DIR"
          bye
          EOF

      - name: Smoke final en produccion
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          Q="v4=${{ github.run_id }}-${{ github.run_attempt }}-$(date +%s)"
          CURL=(--retry 6 --retry-delay 5 --connect-timeout 15 --max-time 45 -fsS -H 'Cache-Control: no-cache')
          curl "${CURL[@]}" "https://cepoes.org/presupuesto/descentralizacion/?$Q" -o /tmp/des.html
          curl "${CURL[@]}" "https://cepoes.org/assets/descentralizacion-observatorio.js?$Q" -o /tmp/des.js
          grep -q 'Descentralización: cuánto administran las Comunas' /tmp/des.html
          grep -q 'id="commune-map"' /tmp/des.html
          grep -q 'class="active" href="/presupuesto/descentralizacion/"' /tmp/des.html
          grep -q 'GEO_COMUNAS' /tmp/des.js
          node --check /tmp/des.js
          for name in descentralizacion-comunas.json descentralizacion-transparencia-2024.json descentralizacion-competencias.json; do
            curl "${CURL[@]}" "https://cepoes.org/assets/data/$name?$Q" | python -m json.tool >/dev/null
          done
          echo '✓ producción V4 publicada y verificada'

      - name: Restaurar produccion anterior si falla el smoke
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          mirror -R --verbose --parallel=2 --no-perms --no-umask _rollback "$REMOTE_DIR"
          bye
          EOF
          echo '✓ rollback completado'
