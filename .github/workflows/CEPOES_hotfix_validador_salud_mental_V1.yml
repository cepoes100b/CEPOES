name: Corregir validador Salud Mental V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cepoes-hotfix-validador-salud-mental-v1
  cancel-in-progress: false

jobs:
  corregir:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Corregir validación HTML → JS → JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("validar_sitio_despliegue.py")
          s = p.read_text(encoding="utf-8")

          old = """salud_mental=(root/'observatorio'/'salud-mental'/'index.html').read_text(encoding='utf-8',errors='replace')
          for token in ['Salud mental: mirar la tendencia sin perder de vista el territorio','5.209','11,84','236','7,97','0800-999-0091','/assets/data/salud-mental.json']:
              assert token in salud_mental, f'Eje Salud mental incompleto: {token}'
          sm_data=json.loads((root/'assets/data/salud-mental.json').read_text(encoding='utf-8'))
          """

          new = """salud_mental=(root/'observatorio'/'salud-mental'/'index.html').read_text(encoding='utf-8',errors='replace')
          for token in ['Salud mental: mirar la tendencia sin perder de vista el territorio','5.209','11,84','236','7,97','0800-999-0091','/assets/salud-mental.css?v=1','/assets/salud-mental.js?v=1']:
              assert token in salud_mental, f'Eje Salud mental incompleto: {token}'
          sm_js=(root/'assets/salud-mental.js').read_text(encoding='utf-8',errors='replace')
          assert '/assets/data/salud-mental.json' in sm_js, 'JS de Salud mental no enlaza el dataset validado'
          sm_data=json.loads((root/'assets/data/salud-mental.json').read_text(encoding='utf-8'))
          """

          if new in s:
              print("✓ El hotfix ya estaba aplicado.")
          elif old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("✓ Validador corregido: HTML → JS → JSON.")
          else:
              raise SystemExit(
                  "El bloque de Salud Mental cambió desde la versión auditada; "
                  "no se modifica automáticamente."
              )
          PY

      - name: Validar sintaxis y alcance
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile validar_sitio_despliegue.py
          python - <<'PY'
          from pathlib import Path

          s = Path("validar_sitio_despliegue.py").read_text(encoding="utf-8")

          required = [
              "'/assets/salud-mental.css?v=1'",
              "'/assets/salud-mental.js?v=1'",
              "assert '/assets/data/salud-mental.json' in sm_js",
              "cepoes-salud-mental-v3",
              "sum(int(x['suicidios_2025'])",
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f"Falta control esperado: {token}")
              print("✓", token)

          bad = "'0800-999-0091','/assets/data/salud-mental.json']"
          if bad in s:
              raise SystemExit("Persistió la validación incorrecta del JSON dentro del HTML.")

          print("✓ Alcance del hotfix validado.")
          PY

      - name: Mostrar diff
        shell: bash
        run: |
          set -euo pipefail
          git diff -- validar_sitio_despliegue.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"

          git add validar_sitio_despliegue.py

          if git diff --cached --quiet; then
            echo "Sin cambios: el hotfix ya está aplicado."
          else
            git commit -m "fix: corregir validacion de salud mental"
            git push origin HEAD:main
          fi

      - name: Confirmar
        shell: bash
        run: |
          set -euo pipefail
          echo "✓ Hotfix del validador de Salud Mental aplicado."
          echo "Siguiente paso: ejecutar manualmente 'Desplegar sitio en Hostinger'."
