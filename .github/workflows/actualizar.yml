name: Actualizar datos del observatorio

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Bajar planillas de IDECBA
        run: python descargar.py
        continue-on-error: true

      - name: Generar datos.json
        run: python generar_datos.py

      - name: Verificar el resultado
        run: python verificar.py

      - name: Commitear si cambió
        run: |
          git config user.name  "cepoes-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: actualización automática $(date -u +%F)"
            git push
          fi
