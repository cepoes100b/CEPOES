name: Actualizar datos del observatorio

on:
  schedule:
    # Cada 6 horas. IDECBA corta las conexiones cuando se le piden muchos
    # archivos seguidos, así que cada corrida baja sólo 4 datasets rotando por
    # antigüedad: con esta frecuencia el ciclo completo se cierra en menos de
    # dos días, de sobra para series mensuales y trimestrales.
    - cron: "20 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Bajar planillas de IDECBA
        run: python descargar.py
        continue-on-error: true

      - name: Generar datos.json
        run: python generar_datos.py

      - name: Verificar el resultado
        run: python verificar.py

      - name: Commitear si cambió
        run: |
          git config user.name  "cepoes-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "datos: actualización automática $(date -u +%F)"
          # La corrida puede durar varios minutos y alguien puede haber tocado
          # el repositorio mientras tanto. Se reintenta trayendo lo remoto por
          # rebase antes de empujar, en vez de fallar por no ser fast-forward.
          for intento in 1 2 3; do
            if git push; then
              echo "Push OK (intento $intento)"
              exit 0
            fi
            echo "Push rechazado, traigo los cambios remotos y reintento…"
            git pull --rebase --autostash origin main || exit 1
            sleep 3
          done
          echo "No pude empujar después de 3 intentos"
          exit 1
