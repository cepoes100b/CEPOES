name: Analizar expedientes legislativos

on:
  push:
    branches: [main]
    paths:
      - "automatizar_analisis_legislativo.py"
      - "automatizar_analisis_legislativo_copilot.py"
      - "automatizar_analisis_legislativo_hardened.py"
      - "automatizar_analisis_legislativo_hardened_v2.py"
      - "automatizar_analisis_legislativo_v3.py"
      - "automatizar_analisis_legislativo_v3_1.py"
      - "automatizar_analisis_legislativo_v3_2.py"
      - "automatizar_analisis_legislativo_v3_3.py"
      - "automatizar_analisis_legislativo_v3_4.py"
      - "proveedor_modelo_legislativo.py"
      - "normativa_referencia_caba.json"
      - ".github/workflows/analizar-legislatura.yml"
      - "infra/supabase/007_analisis_legislativo_v3.sql"
      - "supabase/functions/legislative-analysis-ingest-v2/**"
  schedule:
    - cron: "15 14,21 * * 1-5"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Máximo de borradores nuevos a generar"
        required: false
        default: "3"

permissions:
  contents: read
  id-token: write

concurrency:
  group: analisis-legislativo-privado
  cancel-in-progress: true

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANALYSIS_MAX_ITEMS: ${{ inputs.max_items || '3' }}
      ANALYSIS_MODEL_PROVIDER: auto
      OPENAI_ANALYSIS_MODEL: gpt-5.6-terra
      LEGISLATIVE_ANALYSIS_FUNCTION_URL: https://nriexnijkjamrmfivfmd.supabase.co/functions/v1/legislative-analysis-ingest-v2
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verificar proveedor disponible
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Proveedor resuelto: OpenAI API (${OPENAI_ANALYSIS_MODEL})."
          elif [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "Proveedor resuelto: GitHub Copilot CLI."
          else
            echo "Falta un proveedor: configurar OPENAI_API_KEY o COPILOT_GITHUB_TOKEN." >&2
            exit 21
          fi
      - name: Instalar dependencias
        shell: bash
        run: |
          pip install -r requirements.txt
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            npm install -g @github/copilot@latest
          fi
      - name: Generar y guardar borradores privados
        run: python automatizar_analisis_legislativo_v3_4.py --max-items "$ANALYSIS_MAX_ITEMS"
