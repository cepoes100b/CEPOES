name: Analizar expedientes legislativos

on:
  push:
    branches: [main]
    paths:
      - "automatizar_analisis_legislativo.py"
      - "automatizar_analisis_legislativo_copilot.py"
      - "automatizar_analisis_legislativo_hardened.py"
      - "automatizar_analisis_legislativo_hardened_v2.py"
      - "automatizar_analisis_legislativo_v3.py"
      - "automatizar_analisis_legislativo_v3_1.py"
      - "automatizar_analisis_legislativo_v3_2.py"
      - "automatizar_analisis_legislativo_v3_3.py"
      - "normativa_referencia_caba.json"
      - ".github/workflows/analizar-legislatura.yml"
      - "infra/supabase/007_analisis_legislativo_v3.sql"
      - "supabase/functions/legislative-analysis-ingest-v2/**"
  schedule:
    - cron: "15 14,21 * * 1-5"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Máximo de borradores nuevos a generar"
        required: false
        default: "3"

permissions:
  contents: read
  id-token: write

concurrency:
  group: analisis-legislativo-privado
  cancel-in-progress: true

jobs:
  analizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANALYSIS_MAX_ITEMS: ${{ inputs.max_items || '3' }}
      COPILOT_AUTO_UPDATE: "false"
      LEGISLATIVE_ANALYSIS_FUNCTION_URL: https://nriexnijkjamrmfivfmd.supabase.co/functions/v1/legislative-analysis-ingest-v2
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verificar credencial de Copilot
        shell: bash
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "Falta el secreto COPILOT_GITHUB_TOKEN (fine-grained PAT con Copilot Requests)." >&2
            exit 21
          fi
      - name: Instalar el mismo binario de Copilot verificado en QA
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/cepoes-copilot"
          mkdir -m 700 -- "$install_dir"
          env -i PATH="$PATH" HOME="$install_dir" \
            python qa/probar_copilot_cli_release.py --install-bin "$install_dir/copilot"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt
      - name: Validar opciones del CLI sin inferencia
        shell: bash
        run: |
          set -euo pipefail
          test "$(command -v copilot)" = "$RUNNER_TEMP/cepoes-copilot/copilot"
          python -c 'from automatizar_analisis_legislativo_copilot import check_copilot_cli; check_copilot_cli()'
      - name: Generar y guardar borradores privados
        run: python automatizar_analisis_legislativo_v3_3.py --max-items "$ANALYSIS_MAX_ITEMS"
