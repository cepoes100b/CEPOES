name: Clasificar residuales BCRA v2.29

on:
  pull_request:
    branches:
      - endeudamiento-bcra-direct-v229
    paths:
      - clasificar_residuales_bcra.py
      - clasificar_residuales_bcra_v2.py
      - .github/workflows/clasificar-residuales-bcra-v229.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  clasificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Descargar agregado por entidad ya calculado
        uses: actions/download-artifact@v4
        with:
          name: diagnostico-bcra-entidades-v229
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32596819921
      - name: Preparar entrada agregada
        run: |
          test -f input/diagnostico_bcra_entidades.json
          cp input/diagnostico_bcra_entidades.json ./diagnostico_bcra_entidades.json
      - name: Clasificar residuales contra registros oficiales
        run: python clasificar_residuales_bcra_v2.py
      - name: Validar salida
        run: |
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_residuales_bcra.json', encoding='utf-8'))
          assert x['input']['residuales_fuera_eeff_pnfc'] == 30
          assert x['fuentes_oficiales']['fideicomiso_financiero']['codigos_unicos'] >= 10
          assert x['fuentes_oficiales']['sgr']['codigos_unicos'] >= 30
          assert x['fuentes_oficiales']['fgcp']['codigos_unicos'] >= 10
          assert x['fuentes_oficiales']['pscpp']['codigos_unicos'] >= 5
          assert x['privacidad']['microdatos_personales_leidos'] is False
          print(json.dumps({
              'categorias': {k:v['entidades'] for k,v in x['por_categoria_residual'].items()},
              'escenarios': x['escenarios_aditivos_sensibilidad'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-residuales-bcra-v229
          path: diagnostico_residuales_bcra.json
          retention-days: 7
