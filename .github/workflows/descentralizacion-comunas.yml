name: Actualizar descentralización comunal
on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 26 2,5,8,11 *'
permissions:
  contents: write
concurrency:
  group: cepoes-descentralizacion-comunas
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generar componente presupuestario
        run: python generar_descentralizacion_comunas.py
      - name: Verificar
        run: python verificar_descentralizacion_comunas.py
      - name: Guardar último dato validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add descentralizacion_comunas.json deploy/site-overlay/assets/data/descentralizacion-comunas.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: actualizar descentralizacion comunal"
            git push
          fi
