name: Actualizar descentralización comunal
on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 26 2,5,8,11 *'
permissions:
  contents: write
concurrency:
  group: cepoes-descentralizacion-comunas
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generar componente presupuestario
        run: python generar_descentralizacion_comunas.py
      - name: Verificar
        run: python verificar_descentralizacion_comunas.py
      - name: Guardar último dato validado
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add descentralizacion_comunas.json deploy/site-overlay/assets/data/descentralizacion-comunas.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "datos: actualizar descentralizacion comunal" -m "$(python deploy/registrar_actualizacion.py trailers)"
          push_ok=0
          for intento in 1 2 3; do
            if git push; then
              python deploy/registrar_actualizacion.py post-push
              push_ok=1
              break
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          [ "$push_ok" -eq 1 ] || exit 1
