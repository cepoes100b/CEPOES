# R2-A3: único workflow autorizado para escribir el sitio en producción.
name: Desplegar sitio en Hostinger

on:
  push:
    branches: [main]
    paths:
      - "deploy/site-overlay/**"
      - "deploy/preparar_sitio_publico.py"
      - "deploy/preparar_legislatura_publica.py"
      - "deploy/parche_observatorio_salud.py"
      - "deploy/preparar_puente_legislatura.py"
      - "deploy/validar_publicacion_canonica.py"
      - "deploy/delete-paths.txt"
      - "deploy/publication-inputs.json"
      - "deploy/crear_release_durable.py"
      - "generar_indice_busqueda_equipamientos.py"
      - "generar_indice_busqueda_global.py"
      - "generar_estado_datos.py"
      - "deploy/search-registry.json"
      - "equipamientos/**"
      - "legislatura_publica.json"
      - "sesiones_publicas.json"
      - "territorio.json"
      - "presupuesto.json"
      - "validar_contraste_visual.py"
      - "validar_sitio_despliegue.py"
      - "validar_busqueda_global.py"
      - "validar_r1_runtime.py"
      - "notificar_indexnow.py"
      - "validar_rutas_publicacion.py"
      - "validar_rollback_durable.py"
      - ".github/workflows/desplegar-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cepoes-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
      SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
      SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
      REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}

    steps:
      - uses: actions/checkout@v5

      - name: Validar ruta canónica y entradas declaradas
        run: python validar_rutas_publicacion.py

      - name: Verificar configuración de producción
        shell: bash
        run: |
          set -euo pipefail
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD REMOTE_DIR; do
            if [ -z "${!v:-}" ]; then
              echo "Falta configurar el secreto $v" >&2
              exit 1
            fi
          done
          echo "SFTP_PORT=${SFTP_PORT:-65002}" >> "$GITHUB_ENV"
          echo "Configuración presente. Puerto: ${SFTP_PORT:-65002}"

      - name: Instalar cliente SFTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Diagnosticar acceso SFTP
        shell: bash
        run: |
          set -euo pipefail
          echo "1/2 · Probando conectividad TCP al servidor SFTP..."
          tcp_ok=0
          for intento in 1 2 3; do
            if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$SFTP_HOST/$SFTP_PORT"; then
              tcp_ok=1
              break
            fi
            echo "TCP no disponible en intento $intento/3; reintentando..." >&2
            sleep $((intento * 3))
          done
          if [ "$tcp_ok" -ne 1 ]; then
            echo "ERROR SFTP-TCP: GitHub no puede abrir una conexión con el host/puerto configurados tras 3 intentos." >&2
            echo "Revisar HOSTINGER_SFTP_HOST y HOSTINGER_SFTP_PORT en Hostinger > Acceso SSH." >&2
            exit 31
          fi
          echo "TCP OK"
          echo "2/2 · Probando autenticación y ruta remota..."
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          pwd
          cls -1 "$REMOTE_DIR"
          bye
          EOF
          echo "SFTP OK: autenticación y ruta remota accesibles"

      - name: Descargar producción como respaldo y base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _rollback _site
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          mirror --verbose --parallel=2 "$REMOTE_DIR" _rollback
          bye
          EOF
          test -s _rollback/index.html || { echo "El respaldo no contiene index.html; revisar HOSTINGER_REMOTE_DIR" >&2; exit 32; }
          cp -a _rollback/. _site/

      - name: Aplicar versión GitHub sobre la copia de producción
        shell: bash
        run: |
          set -euo pipefail
          python generar_indice_busqueda_equipamientos.py
          test -d deploy/site-overlay
          cp -a deploy/site-overlay/. _site/
          if [ -s deploy/delete-paths.txt ]; then
            while IFS= read -r rel; do
              rel="${rel%%#*}"
              rel="$(echo "$rel" | xargs)"
              [ -z "$rel" ] && continue
              case "$rel" in
                /*|*".."*) echo "Ruta de borrado no permitida: $rel" >&2; exit 1;;
              esac
              rm -rf -- "_site/$rel"
            done < deploy/delete-paths.txt
          fi
          python deploy/preparar_legislatura_publica.py _site
          python generar_indice_busqueda_global.py _site
          python generar_estado_datos.py _site

      - name: Ajustar texto público de seguimiento institucional
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")
          old = re.compile(
              r"CEPOES\s+prioriza\s+editorialmente\s+el\s+seguimiento\s+de\s+la\s+legisladora\s+Claudia\s+Negri\s+y,\s+en\s+segundo\s+término,\s+de\s+los\s+proyectos\s+impulsados\s+por\s+integrantes\s+del\s+bloque\s+Fuerza\s+por\s+Buenos\s+Aires\.\s+Los\s+estados,\s+fechas\s+y\s+movimientos\s+provienen\s+de\s+fuentes\s+oficiales\."
          )
          new = (
              "CEPOES realiza un seguimiento sistemático de la actividad legislativa de la Ciudad de Buenos Aires, "
              "con especial atención a las iniciativas vinculadas con sus áreas de estudio y trabajo. El monitoreo "
              "comprende proyectos de ley, tratamiento en comisiones, estados parlamentarios y principales movimientos "
              "legislativos, a partir de información proveniente de fuentes oficiales."
          )

          extensions = {".html", ".htm", ".js", ".json", ".xml", ".txt"}
          replacements = 0
          already_present = False

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if new in text:
                  already_present = True
              updated, count = old.subn(new, text)
              if count:
                  path.write_text(updated, encoding="utf-8")
                  replacements += count
                  print(f"Actualizado: {path} ({count})")

          if replacements:
              print(f"Texto institucional actualizado en {replacements} ocurrencia(s).")
          elif already_present:
              print("El texto institucional público ya estaba actualizado.")
          else:
              raise SystemExit("No se encontró ni el texto anterior ni el nuevo; se aborta para evitar un despliegue sin el cambio solicitado.")
          PY

      - name: Normalizar navegación y fallbacks públicos
        run: python deploy/preparar_sitio_publico.py _site

      - name: Integrar módulos públicos en el build canónico
        shell: bash
        run: |
          set -euo pipefail
          python deploy/parche_observatorio_salud.py _site/observatorio/index.html
          python deploy/preparar_puente_legislatura.py _site

      - name: Validar módulos migrados al publicador canónico
        run: python deploy/validar_publicacion_canonica.py _site

      - name: Bloquear despliegue con contrastes críticos deficientes
        run: python validar_contraste_visual.py

      - name: Validar búsqueda global canónica
        run: python validar_busqueda_global.py _site

      - name: Validar confianza y robustez R1
        run: python validar_r1_runtime.py _site

      - name: Validar sitio antes de publicar
        run: python validar_sitio_despliegue.py _site

      - name: Preparar release durable y manifiesto
        shell: bash
        run: |
          set -euo pipefail
          python deploy/crear_release_durable.py \
            --before _rollback \
            --candidate _site \
            --output _release \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --retention-days 90

      - name: Conservar release durable en registro privado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_owner="${GITHUB_REPOSITORY_OWNER,,}"
          package_name="cepoes-durable-backups"
          package_path="${package_owner}/${package_name}"
          image="ghcr.io/${package_owner}/${package_name}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          anonymous_status="$(curl -sS -o /tmp/package-anonymous-preflight.json -w '%{http_code}' \
            "https://ghcr.io/v2/${package_path}/tags/list")"
          case "$anonymous_status" in
            200) echo "El paquete durable permite lectura anónima; se aborta antes de subir contenido." >&2; exit 33 ;;
            401|404) ;;
            *) echo "No se pudo comprobar el acceso anónimo previo (HTTP $anonymous_status)." >&2; exit 33 ;;
          esac

          mkdir -p _release-image/payload
          cp -a _release/. _release-image/payload/
          cat > _release-image/Dockerfile <<EOF
          FROM scratch
          LABEL org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}"
          LABEL org.opencontainers.image.revision="${GITHUB_SHA}"
          COPY payload/ /release/
          EOF

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$image" _release-image
          docker push "$image" | tee /tmp/release-push.log

          digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' /tmp/release-push.log | tail -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$image" >/dev/null
          if docker pull "$image@${digest}" > /tmp/package-anonymous-pull.log 2>&1; then
            echo "El release durable puede descargarse sin autenticación; se aborta antes de publicar por SFTP." >&2
            exit 33
          fi
          grep -Eiq 'denied|unauthorized|authentication required' /tmp/package-anonymous-pull.log || {
            echo "La prueba anónima falló por una causa distinta de autenticación; no se puede demostrar privacidad." >&2
            sed -n '1,20p' /tmp/package-anonymous-pull.log >&2
            exit 33
          }

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image@${digest}" >/dev/null

          {
            echo ""
            echo "### Custodia privada"
            echo "- Imagen: \`${image}@${digest}\`"
            echo "- Privacidad verificada: descarga anónima denegada y descarga autenticada válida"
            echo "- Política mínima: 90 días y 10 publicaciones"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar en Hostinger por SFTP
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          mirror -R --verbose --parallel=2 --no-perms --no-umask _site "$REMOTE_DIR"
          bye
          EOF

      - name: Smoke test de producción
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          # Hostinger/CDN puede mantener durante unos segundos el HTML/JS anterior.
          # El smoke debe validar lo recién publicado, no una respuesta de caché.
          SMOKE_Q="smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          CURL_COMMON=(--retry 3 --retry-delay 3 --connect-timeout 15 --max-time 40 -fsS -H "Cache-Control: no-cache" -H "Pragma: no-cache")

          for url in \
            https://cepoes.org/ \
            https://cepoes.org/observatorio/ \
            https://cepoes.org/observatorio/personas-mayores/ \
            https://cepoes.org/territorio/ \
            https://cepoes.org/territorio/estructura-productiva/ \
            https://cepoes.org/assets/estructura-productiva-bootstrap.js \
            https://cepoes.org/assets/estructura-productiva.js \
            https://cepoes.org/assets/data/estructura-productiva/actual.json \
            https://cepoes.org/assets/data/estructura-productiva/comunas.geojson \
            https://cepoes.org/territorio/deporte-salud/ \
            https://cepoes.org/assets/deporte-salud.js \
            https://cepoes.org/assets/data/deporte-salud.json \
            https://cepoes.org/assets/data/deporte-accesibilidad.json \
            https://cepoes.org/assets/data/deporte-accesibilidad-peatonal.json \
            https://cepoes.org/territorio/endeudamiento/ \
            https://cepoes.org/territorio/migraciones/ \
            https://cepoes.org/publicaciones/informes/personas-mayores-caba/ \
            https://cepoes.org/publicaciones/informes/personas-mayores-caba/informe-personas-mayores-caba-cepoes.pdf \
            https://cepoes.org/publicaciones/informes/situacion-de-calle-caba/ \
            https://cepoes.org/publicaciones/informes/situacion-de-calle-caba/informe-situacion-de-calle-caba-cepoes.pdf \
            https://cepoes.org/legislatura/ \
            https://cepoes.org/assets/legislatura-public-bridge.js \
            https://cepoes.org/legislatura_publica.json \
            https://cepoes.org/sesiones_publicas.json; do
            echo "Probando $url sin caché"
            curl "${CURL_COMMON[@]}" "${url}?${SMOKE_Q}" >/dev/null
          done

          curl "${CURL_COMMON[@]}" "https://cepoes.org/assets/data/estructura-productiva/actual.json?${SMOKE_Q}" \
            | python -c 'import json,sys; d=json.load(sys.stdin); e=d["panorama"]["ejes_comerciales"]; assert d["panorama"]["empresas_registradas"]["periodo"] >= 2024; assert e["periodo"]["anio"] >= 2026; assert len(e["comunas"]) == 15; assert "comparacion_interanual" in e; print("Estructura productiva: JSON público analítico válido")'

          curl "${CURL_COMMON[@]}" "https://cepoes.org/assets/data/estructura-productiva/comunas.geojson?${SMOKE_Q}" \
            | python -c 'import json,sys; d=json.load(sys.stdin); fs=d.get("features",[]); assert d.get("type") == "FeatureCollection"; assert len(fs) == 15; assert {int(f["properties"]["comuna"]) for f in fs} == set(range(1,16)); print("Estructura productiva: GeoJSON público válido · 15 comunas")'

          curl "${CURL_COMMON[@]}" "https://cepoes.org/assets/data/deporte-salud.json?${SMOKE_Q}" \
            | python -c 'import json,sys; d=json.load(sys.stdin); r=d["resumen"]; assert set(d["comunas"]) == {str(i) for i in range(1,16)}; assert r["clubes"] > 100; assert r["polideportivos"] >= 10; assert r["estaciones_saludables"] >= 10; assert r["cesac"] >= 20; assert "programas_desactualizados" in d["alertas"]; print("Deporte y salud: JSON público válido · 15 comunas")'

          curl "${CURL_COMMON[@]}" "https://cepoes.org/assets/data/deporte-accesibilidad.json?${SMOKE_Q}" \
            | python -c 'import json,sys; d=json.load(sys.stdin); b=d["base_poblacional"]; c=d["cobertura"]; assert b["radios"] >= 3500; assert b["diferencia_pct"] < .1; assert d["metodologia"]["distancias_m"] == [800,1000]; assert set(c) >= {"clubes","polideportivos","red_deportiva"}; assert all(set(c[k]["distancias"]["800"]["comunas"]) == {str(i) for i in range(1,16)} for k in c); print("Deporte y salud: accesibilidad geométrica pública válida · 800/1000 m")'

          curl "${CURL_COMMON[@]}" "https://cepoes.org/assets/data/deporte-accesibilidad-peatonal.json?${SMOKE_Q}" \
            | python -c 'import json,sys; d=json.load(sys.stdin); b=d["base_poblacional"]; c=d["cobertura"]; g=d["grafo_peatonal"]; u=d["control_conexion_red"]["umbrales"]; assert b["radios"] >= 3500; assert b["muestras_ponderadas"] > 150000; assert d["metodologia"]["network_type"] == "walk"; assert g["nodos"] > 20000 and g["aristas_dirigidas"] > 40000; assert u["100"]["poblacion_pct"] < .5; assert u["200"]["poblacion_pct"] < .1; assert set(c) >= {"clubes","polideportivos","red_deportiva"}; assert all(set(c[k]["distancias"]["800"]["comunas"]) == {str(i) for i in range(1,16)} for k in c); assert c["red_deportiva"]["distancias"]["800"]["ciudad"]["cobertura_pct"] < 90.13; print("Deporte y salud V3: accesibilidad peatonal pública válida")'

          curl "${CURL_COMMON[@]}" "https://cepoes.org/territorio/estructura-productiva/?${SMOKE_Q}" -o /tmp/estructura-productiva.html
          curl "${CURL_COMMON[@]}" "https://cepoes.org/assets/estructura-productiva.js?${SMOKE_Q}" -o /tmp/estructura-productiva.js
          grep -q 'prod-matrix' /tmp/estructura-productiva.html
          grep -q 'especializacion' /tmp/estructura-productiva.js
          echo "Estructura productiva: frontend analítico público válido"

          curl "${CURL_COMMON[@]}" "https://cepoes.org/territorio/deporte-salud/?${SMOKE_Q}" -o /tmp/deporte-salud.html
          curl "${CURL_COMMON[@]}" "https://cepoes.org/assets/deporte-salud.js?${SMOKE_Q}" -o /tmp/deporte-salud.js
          grep -q 'ds-access-method' /tmp/deporte-salud.html || { echo "HTML Deporte y salud no corresponde a V3" >&2; exit 41; }
          grep -q 'Recorrido peatonal estimado' /tmp/deporte-salud.html || { echo "HTML Deporte y salud no expone selector peatonal V3" >&2; exit 42; }
          grep -q 'deporte-accesibilidad-peatonal.json' /tmp/deporte-salud.js || { echo "JS Deporte y salud no consume accesibilidad peatonal" >&2; exit 43; }
          grep -q 'accessMethod' /tmp/deporte-salud.js || { echo "JS Deporte y salud no implementa selector V3" >&2; exit 44; }
          echo "Deporte y salud V3: frontend público geométrico + peatonal válido"

          curl "${CURL_COMMON[@]}" "https://cepoes.org/observatorio/?${SMOKE_Q}" -o /tmp/observatorio.html
          grep -q 'id="observatorio-salud-cuidados"' /tmp/observatorio.html
          grep -q '>Natalidad y demografía<' /tmp/observatorio.html
          grep -q '>Salud reproductiva<' /tmp/observatorio.html
          grep -q '>Personas mayores<' /tmp/observatorio.html
          grep -q '/observatorio/#observatorio-salud-cuidados">Salud</a>' /tmp/observatorio.html

          curl "${CURL_COMMON[@]}" "https://cepoes.org/legislatura/?${SMOKE_Q}" -o /tmp/legislatura.html
          grep -q 'legislatura-public-bridge.js?v=20260827-2' /tmp/legislatura.html
          curl "${CURL_COMMON[@]}" "https://cepoes.org/assets/legislatura-public-bridge.js?${SMOKE_Q}" -o /tmp/legislatura-public-bridge.js
          grep -q '__CEPOES_LEGISLATURA_PUBLIC_BRIDGE__' /tmp/legislatura-public-bridge.js

          curl "${CURL_COMMON[@]}" "https://cepoes.org/legislatura_publica.json?${SMOKE_Q}" -o /tmp/legislatura_publica.json
          curl "${CURL_COMMON[@]}" "https://cepoes.org/sesiones_publicas.json?${SMOKE_Q}" -o /tmp/sesiones_publicas.json
          python - <<'PY'
          import json
          leg=json.load(open('/tmp/legislatura_publica.json',encoding='utf-8'))
          ses=json.load(open('/tmp/sesiones_publicas.json',encoding='utf-8'))
          rows=leg.get('expedientes') or []
          total=int((leg.get('universo_consolidado') or {}).get('total') or 0)
          assert total >= 1000 and len(rows) == total
          assert len([x for x in rows if 'claudia negri' in (x.get('autor') or '').lower() or 'negri, claudia' in (x.get('autor') or '').lower()]) >= 200
          assert ses
          print(f'Legislatura pública: {len(rows)} expedientes y sesiones válidas')
          PY

      - name: Restaurar versión anterior si falla publicación o smoke test
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          echo "Fallo posterior a la publicación: restaurando respaldo previo"
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          mirror -R --verbose --parallel=2 --no-perms --no-umask _rollback "$REMOTE_DIR"
          bye
          EOF

      - name: Avisar cambios a IndexNow
        if: success()
        continue-on-error: true
        run: python notificar_indexnow.py --sitemap _site/sitemap.xml --key-file _site/indexnow-key.txt
