name: Desplegar sitio en Hostinger

on:
  push:
    branches: [main]
    paths:
      - "deploy/site-overlay/**"
      - "deploy/delete-paths.txt"
      - "validar_sitio_despliegue.py"
      - "notificar_indexnow.py"
      - ".github/workflows/desplegar-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cepoes-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
      SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
      SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
      REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}

    steps:
      - uses: actions/checkout@v5

      - name: Verificar configuración de producción
        shell: bash
        run: |
          set -euo pipefail
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD REMOTE_DIR; do
            if [ -z "${!v:-}" ]; then
              echo "Falta configurar el secreto $v" >&2
              exit 1
            fi
          done
          echo "SFTP_PORT=${SFTP_PORT:-65002}" >> "$GITHUB_ENV"
          echo "Configuración presente. Puerto: ${SFTP_PORT:-65002}"

      - name: Instalar cliente SFTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Diagnosticar acceso SFTP
        shell: bash
        run: |
          set -euo pipefail
          echo "1/2 · Probando conectividad TCP al servidor SFTP..."
          if ! timeout 15 bash -c "cat < /dev/null > /dev/tcp/$SFTP_HOST/$SFTP_PORT"; then
            echo "ERROR SFTP-TCP: GitHub no puede abrir una conexión con el host/puerto configurados." >&2
            echo "Revisar HOSTINGER_SFTP_HOST y HOSTINGER_SFTP_PORT en Hostinger > Acceso SSH." >&2
            exit 31
          fi
          echo "TCP OK"
          echo "2/2 · Probando autenticación y ruta remota..."
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 15
          pwd
          cls -1 "$REMOTE_DIR"
          bye
          EOF
          echo "SFTP OK: autenticación y ruta remota accesibles"

      - name: Descargar producción como respaldo y base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _rollback _site
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          mirror --verbose --parallel=2 "$REMOTE_DIR" _rollback
          bye
          EOF
          test -s _rollback/index.html || { echo "El respaldo no contiene index.html; revisar HOSTINGER_REMOTE_DIR" >&2; exit 32; }
          cp -a _rollback/. _site/

      - name: Aplicar versión GitHub sobre la copia de producción
        shell: bash
        run: |
          set -euo pipefail
          test -d deploy/site-overlay
          cp -a deploy/site-overlay/. _site/
          if [ -s deploy/delete-paths.txt ]; then
            while IFS= read -r rel; do
              rel="${rel%%#*}"
              rel="$(echo "$rel" | xargs)"
              [ -z "$rel" ] && continue
              case "$rel" in
                /*|*".."*) echo "Ruta de borrado no permitida: $rel" >&2; exit 1;;
              esac
              rm -rf -- "_site/$rel"
            done < deploy/delete-paths.txt
          fi

      - name: Ajustar texto público de seguimiento institucional
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")
          old = re.compile(
              r"CEPOES\s+prioriza\s+editorialmente\s+el\s+seguimiento\s+de\s+la\s+legisladora\s+Claudia\s+Negri\s+y,\s+en\s+segundo\s+término,\s+de\s+los\s+proyectos\s+impulsados\s+por\s+integrantes\s+del\s+bloque\s+Fuerza\s+por\s+Buenos\s+Aires\.\s+Los\s+estados,\s+fechas\s+y\s+movimientos\s+provienen\s+de\s+fuentes\s+oficiales\."
          )
          new = (
              "CEPOES realiza un seguimiento sistemático de la actividad legislativa de la Ciudad de Buenos Aires, "
              "con especial atención a las iniciativas vinculadas con sus áreas de estudio y trabajo. El monitoreo "
              "comprende proyectos de ley, tratamiento en comisiones, estados parlamentarios y principales movimientos "
              "legislativos, a partir de información proveniente de fuentes oficiales."
          )

          extensions = {".html", ".htm", ".js", ".json", ".xml", ".txt"}
          replacements = 0
          already_present = False

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if new in text:
                  already_present = True
              updated, count = old.subn(new, text)
              if count:
                  path.write_text(updated, encoding="utf-8")
                  replacements += count
                  print(f"Actualizado: {path} ({count})")

          if replacements:
              print(f"Texto institucional actualizado en {replacements} ocurrencia(s).")
          elif already_present:
              print("El texto institucional público ya estaba actualizado.")
          else:
              raise SystemExit("No se encontró ni el texto anterior ni el nuevo; se aborta para evitar un despliegue sin el cambio solicitado.")
          PY

      - name: Validar sitio antes de publicar
        run: python validar_sitio_despliegue.py _site

      - name: Publicar en Hostinger por SFTP
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          mirror -R --verbose --parallel=2 --no-perms --no-umask _site "$REMOTE_DIR"
          bye
          EOF

      - name: Smoke test de producción
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://cepoes.org/ \
            https://cepoes.org/observatorio/ \
            https://cepoes.org/territorio/ \
            https://cepoes.org/territorio/estructura-productiva/ \
            https://cepoes.org/assets/estructura-productiva-bootstrap.js \
            https://cepoes.org/assets/estructura-productiva.js \
            https://cepoes.org/assets/data/estructura-productiva/actual.json \
            https://cepoes.org/assets/data/estructura-productiva/comunas.geojson \
            https://cepoes.org/territorio/endeudamiento/ \
            https://cepoes.org/territorio/migraciones/ \
            https://cepoes.org/legislatura/; do
            echo "Probando $url"
            curl --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 40 -fsS "$url" >/dev/null
          done

          # Además de responder 200, el dataset productivo debe seguir siendo JSON válido.
          curl --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 40 -fsS \
            https://cepoes.org/assets/data/estructura-productiva/actual.json \
            | python -c 'import json,sys; d=json.load(sys.stdin); e=d["panorama"]["ejes_comerciales"]; assert d["panorama"]["empresas_registradas"]["periodo"] >= 2024; assert e["periodo"]["anio"] >= 2026; assert len(e["comunas"]) == 15; assert "comparacion_interanual" in e; print("Estructura productiva: JSON público analítico válido")'

          # El mapa comunal debe conservar exactamente las 15 unidades administrativas oficiales.
          curl --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 40 -fsS \
            https://cepoes.org/assets/data/estructura-productiva/comunas.geojson \
            | python -c 'import json,sys; d=json.load(sys.stdin); fs=d.get("features",[]); assert d.get("type") == "FeatureCollection"; assert len(fs) == 15; assert {int(f["properties"]["comuna"]) for f in fs} == set(range(1,16)); print("Estructura productiva: GeoJSON público válido · 15 comunas")'

          # El HTML y el JS publicados deben contener las funciones analíticas centrales.
          curl --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 40 -fsS \
            https://cepoes.org/territorio/estructura-productiva/ | grep -q 'prod-matrix'
          curl --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 40 -fsS \
            https://cepoes.org/assets/estructura-productiva.js | grep -q 'especializacion'
          echo "Estructura productiva: frontend analítico público válido"

      - name: Restaurar versión anterior si falla publicación o smoke test
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          echo "Fallo posterior a la publicación: restaurando respaldo previo"
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          mirror -R --verbose --parallel=2 --no-perms --no-umask _rollback "$REMOTE_DIR"
          bye
          EOF

      - name: Avisar cambios a IndexNow
        if: success()
        continue-on-error: true
        run: python notificar_indexnow.py --sitemap _site/sitemap.xml --key-file _site/indexnow-key.txt
