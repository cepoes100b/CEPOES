name: Diagnosticar fuente dinámica registros BCRA v2.29

on:
  pull_request:
    branches:
      - endeudamiento-bcra-direct-v229
    paths:
      - diagnosticar_respuesta_registros_bcra_api.py
      - .github/workflows/diagnosticar-fuente-registros-bcra-v229.yml

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Inspeccionar esquema mínimo de endpoints BCRA
        run: python diagnosticar_respuesta_registros_bcra_api.py
      - name: Mostrar candidatos de código
        run: |
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_esquema_registros_bcra_api.json', encoding='utf-8'))
          for k,v in x['registros'].items():
              print(k, json.dumps({
                  'endpoint':v.get('endpoint'),
                  'status':v.get('status'),
                  'shape':v.get('shape'),
                  'candidato_codigo':v.get('candidato_codigo'),
                  'campos_5_digitos':v.get('campos_5_digitos'),
                  'error':v.get('error'),
              }, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-esquema-registros-bcra-api-v229
          path: diagnostico_esquema_registros_bcra_api.json
          retention-days: 7
