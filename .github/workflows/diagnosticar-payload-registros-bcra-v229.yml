name: Diagnosticar payload registros BCRA v2.29

on:
  pull_request:
    branches:
      - endeudamiento-bcra-direct-v229
    paths:
      - diagnosticar_payload_registros_bcra.py
      - .github/workflows/diagnosticar-payload-registros-bcra-v229.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspeccionar payloads institucionales
        run: python diagnosticar_payload_registros_bcra.py
      - name: Mostrar forma
        run: |
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_payload_registros_bcra.json', encoding='utf-8'))
          for k,v in x['endpoints'].items():
              print('\n', k, v['status'], v['bytes'])
              for l in v['listas_de_registros']:
                  print(l['ruta'], l['cantidad'], l['claves_primer_registro'])
                  print('muestra:', l['muestras'][:1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-payload-registros-bcra-v229
          path: diagnostico_payload_registros_bcra.json
          retention-days: 7
