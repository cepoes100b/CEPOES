name: Actualizar Endeudamiento BCRA

on:
  schedule:
    # Chequeo liviano diario: 09:17 de Buenos Aires (12:17 UTC).
    # Los microdatos sólo se descargan cuando aparece un AAAAMMDEUDORES nuevo.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endeudamiento-bcra-mensual
  cancel-in-progress: false

jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      nueva: ${{ steps.estado.outputs.nueva }}
      periodo: ${{ steps.estado.outputs.periodo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Detectar publicación BCRA
        run: python detectar_novedad_bcra.py
      - id: estado
        name: Exponer estado
        shell: bash
        run: |
          NUEVA=$(python -c "import json; x=json.load(open('novedad_bcra.json')); print(str(bool(x['hay_novedad'])).lower())")
          PERIODO=$(python -c "import json; print(json.load(open('novedad_bcra.json'))['periodo'])")
          echo "nueva=$NUEVA" >> "$GITHUB_OUTPUT"
          echo "periodo=$PERIODO" >> "$GITHUB_OUTPUT"
          echo "Nueva publicación: $NUEVA · período: $PERIODO"

  actualizar:
    needs: detectar
    if: needs.detectar.outputs.nueva == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --disable-pip-version-check requests

      - name: Verificar herramientas y matriz territorial
        run: |
          python -m py_compile descargar_bcra_deudores.py procesar_universo_territorial_integral.py procesar_endeudamiento_productivo.py generar_endeudamiento_barrios.py
          test -s datos/endeudamiento/matriz_cp_barrio.json || { echo "Falta matriz territorial congelada y validada" >&2; exit 1; }

      - name: Descargar PADRON ARCA con reintentos
        shell: bash
        run: |
          set -euo pipefail
          for intento in 1 2 3; do
            echo "PADRON intento $intento/3"
            python descargar_bcra_deudores.py PADRON || true
            ARCHIVO="$(find bcra_deudores -maxdepth 1 -type f -name '*PADRON.7Z' -print -quit 2>/dev/null || true)"
            if [ -n "$ARCHIVO" ] && 7z t "$ARCHIVO" >/dev/null; then
              echo "PADRON íntegro: $ARCHIVO"
              break
            fi
            rm -f bcra_deudores/*PADRON.7Z bcra_deudores/*PADRON.7Z.part 2>/dev/null || true
            if [ "$intento" -eq 3 ]; then exit 1; fi
            sleep $((intento * 15))
          done

      - name: Descargar DEUDORES BCRA con reintentos
        shell: bash
        run: |
          set -euo pipefail
          for intento in 1 2 3; do
            echo "DEUDORES intento $intento/3"
            python descargar_bcra_deudores.py DEUDORES || true
            ARCHIVO="$(find bcra_deudores -maxdepth 1 -type f -name '*DEUDORES.7Z' -print -quit 2>/dev/null || true)"
            if [ -n "$ARCHIVO" ] && 7z t "$ARCHIVO" >/dev/null; then
              echo "DEUDORES íntegro: $ARCHIVO"
              break
            fi
            rm -f bcra_deudores/*DEUDORES.7Z bcra_deudores/*DEUDORES.7Z.part 2>/dev/null || true
            if [ "$intento" -eq 3 ]; then exit 1; fi
            sleep $((intento * 15))
          done

      - name: Procesar BCRA y ARCA
        run: python procesar_endeudamiento_productivo.py

      - name: Validar agregado antes de territorializar
        run: |
          python - <<'PY'
          import json
          d=json.load(open('diagnostico_endeudamiento_productivo.json', encoding='utf-8'))
          assert d['privacidad']['microdatos_publicados'] is False
          assert d['privacidad']['identificadores_personales_en_salida'] is False
          assert d['controles']['cendeu_registros_leidos'] > 30_000_000
          assert len(d['agregado_cp_caba_1000_1499']['filas']) >= 300
          c=d['cobertura_territorial_cp4_sobre_caba']
          assert c['deudores_pct'] >= 90
          assert c['deuda_total_pct'] >= 90
          print('Período:', d['periodo_deuda'])
          print('Cobertura territorial:', c)
          PY

      - name: Generar 48 barrios
        run: python generar_endeudamiento_barrios.py

      - name: Verificar salida pública
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.load(open('datos/endeudamiento/manifest.json', encoding='utf-8'))
          p=m['ultimo_periodo']
          x=json.load(open(pathlib.Path('datos/endeudamiento')/f'{p}.json', encoding='utf-8'))
          assert x['periodo'] == p
          assert x['titulo'] == 'Endeudamiento por barrio'
          assert len(x['segmentos'][0]['barrios']) == 48
          assert len({b['barrio'] for b in x['segmentos'][0]['barrios']}) == 48
          assert x['fuente']['principal'].startswith('Banco Central')
          assert x['metodologia']['naturaleza'] == 'estimacion territorial agregada'
          print('OK:', p, '· segmentos:', len(x['segmentos']), '· barrios: 48')
          PY

      - name: Versionar únicamente agregados públicos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@github.com"
          git add datos/endeudamiento/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios públicos"
            exit 0
          fi
          git commit -m "endeudamiento: actualización BCRA ${PERIODO:-${{ needs.detectar.outputs.periodo }}}"
          for intento in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          exit 1

      - name: Eliminar archivos crudos y diagnósticos locales
        if: always()
        run: |
          rm -rf bcra_deudores
          rm -f *.part diagnostico_endeudamiento_productivo.json novedad_bcra.json
