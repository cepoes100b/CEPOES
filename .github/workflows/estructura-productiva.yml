name: Actualizar estructura productiva

on:
  push:
    branches: [main]
    paths:
      - "generar_estructura_productiva.py"
      - "verificar_estructura_productiva.py"
      - ".github/workflows/estructura-productiva.yml"
  schedule:
    # Lunes 09:20 de Buenos Aires. El RUS es estructural y la cartografía cambia
    # poco; una consulta semanal alcanza para detectar reemplazos de fuente.
    - cron: "20 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-estructura-productiva
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "requests>=2.31"

      - name: Resolver archivo RUS 2022-2024 desde CKAN
        id: resolver
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee /tmp/estructura-productiva-resolver.log
          import pathlib, requests, sys

          RESOURCE_ID = "3c7e5f10-577a-44ea-b614-82cc05f842aa"
          API = f"https://data.buenosaires.gob.ar/api/3/action/resource_show?id={RESOURCE_ID}"
          FALLBACK = "https://data.buenosaires.gob.ar/es_AR/dataset/relevamiento-usos-suelo/resource/3c7e5f10-577a-44ea-b614-82cc05f842aa/download"

          r = requests.get(API, timeout=60, headers={"User-Agent": "CEPOES-data/1.0"})
          r.raise_for_status()
          payload = r.json()
          if not payload.get("success"):
              raise RuntimeError(f"CKAN no devolvió success: {payload}")
          meta = payload.get("result") or {}
          url = meta.get("url") or meta.get("download_url")
          if not url:
              raise RuntimeError(f"CKAN no devolvió URL para {RESOURCE_ID}")

          print("CKAN resource:", meta.get("name"))
          print("CKAN format:", meta.get("format"))
          print("CKAN URL:", url)

          probe = requests.get(url, timeout=90, allow_redirects=True, stream=True,
                               headers={"User-Agent": "CEPOES-data/1.0"})
          print("HTTP:", probe.status_code, "final:", probe.url,
                "content-type:", probe.headers.get("content-type"),
                "length:", probe.headers.get("content-length"))
          probe.raise_for_status()
          probe.close()

          p = pathlib.Path("generar_estructura_productiva.py")
          src = p.read_text(encoding="utf-8")
          if FALLBACK not in src:
              raise RuntimeError("No encontré la URL RUS esperada en el generador")
          p.write_text(src.replace(FALLBACK, url), encoding="utf-8")
          PY
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            {
              echo "Fecha UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Commit: $GITHUB_SHA"
              echo "Fase: resolver recurso CKAN"
              echo "Exit code: $rc"
              echo
              cat /tmp/estructura-productiva-resolver.log
            } > diagnostico_estructura_productiva.txt
          fi
          exit 0

      - name: Generar mapa y detalle por comuna
        id: generar
        if: steps.resolver.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python generar_estructura_productiva.py 2>&1 | tee /tmp/estructura-productiva.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            {
              echo "Fecha UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Commit: $GITHUB_SHA"
              echo "Fase: generar"
              echo "Exit code: $rc"
              echo
              cat /tmp/estructura-productiva.log
            } > diagnostico_estructura_productiva.txt
          fi
          exit 0

      - name: Verificar datos generados
        id: verificar
        if: steps.resolver.outputs.rc == '0' && steps.generar.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python verificar_estructura_productiva.py 2>&1 | tee /tmp/estructura-productiva-verificacion.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            {
              echo "Fecha UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Commit: $GITHUB_SHA"
              echo "Fase: verificar"
              echo "Exit code verificación: $rc"
              echo
              cat /tmp/estructura-productiva-verificacion.log
            } > diagnostico_estructura_productiva.txt
          fi
          exit 0

      - name: Commitear resultado o diagnóstico
        shell: bash
        run: |
          set -e
          git config user.name  "cepoes-bot"
          git config user.email "actions@github.com"

          fallo=0
          if [ "${{ steps.resolver.outputs.rc }}" != "0" ]; then
            fallo=1
          elif [ "${{ steps.generar.outputs.rc }}" != "0" ]; then
            fallo=1
          elif [ "${{ steps.verificar.outputs.rc }}" != "0" ]; then
            fallo=1
          fi

          if [ "$fallo" -eq 1 ]; then
            git add diagnostico_estructura_productiva.txt
            mensaje="territorio: diagnosticar estructura productiva $(date -u +%F)"
          else
            git add deploy/site-overlay/assets/data/estructura-productiva/
            if git ls-files --error-unmatch diagnostico_estructura_productiva.txt >/dev/null 2>&1; then
              git rm diagnostico_estructura_productiva.txt
            fi
            mensaje="territorio: actualizar estructura productiva $(date -u +%F)"
          fi

          if git diff --cached --quiet; then
            echo "Sin cambios"
            [ "$fallo" -eq 0 ] && exit 0 || exit 1
          fi

          git commit -m "$mensaje"
          push_ok=0
          for intento in 1 2 3; do
            if git push; then
              echo "Push OK (intento $intento)"
              push_ok=1
              break
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || exit 1
            sleep 3
          done
          [ "$push_ok" -eq 1 ] || exit 1
          [ "$fallo" -eq 0 ] && exit 0 || exit 1
