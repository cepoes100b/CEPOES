name: Actualizar estructura productiva

on:
  push:
    branches: [main]
    paths:
      - "generar_estructura_productiva.py"
      - "verificar_estructura_productiva.py"
      - ".github/workflows/estructura-productiva.yml"
  schedule:
    - cron: "20 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-estructura-productiva
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "requests>=2.31"

      - name: Preparar base estructural RUS 2017
        id: resolver
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee /tmp/estructura-productiva-resolver.log
          from pathlib import Path
          import requests

          original = "https://data.buenosaires.gob.ar/es_AR/dataset/relevamiento-usos-suelo/resource/3c7e5f10-577a-44ea-b614-82cc05f842aa/download"
          rus2017 = "https://data.buenosaires.gob.ar/dataset/relevamiento-usos-suelo/resource/juqdkmgo-1807-resource/download"
          r = requests.get(rus2017, timeout=180, headers={"User-Agent":"CEPOES-data/1.0"})
          r.raise_for_status()
          head = r.content[:2000].decode('utf-8-sig','replace').lower()
          print(f"RUS 2017 descargable: {len(r.content)/1024/1024:.1f} MB · {r.headers.get('content-type')}")
          if not ('d21' in head or 'rama' in head):
              raise RuntimeError(f"RUS 2017 sin esquema ClaNAE esperado. Encabezado: {head[:500]}")
          p=Path('generar_estructura_productiva.py')
          src=p.read_text(encoding='utf-8')
          if original not in src:
              raise RuntimeError('No encontré la URL RUS esperada en el generador')
          p.write_text(src.replace(original, rus2017),encoding='utf-8')
          PY
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            {
              echo "Fecha UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Commit: $GITHUB_SHA"
              echo "Fase: preparar RUS 2017"
              echo "Exit code: $rc"
              echo
              cat /tmp/estructura-productiva-resolver.log
            } > diagnostico_estructura_productiva.txt
          fi
          exit 0

      - name: Generar mapa y detalle por comuna
        id: generar
        if: steps.resolver.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python generar_estructura_productiva.py 2>&1 | tee /tmp/estructura-productiva.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            {
              echo "Fecha UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Commit: $GITHUB_SHA"
              echo "Fase: generar desde RUS 2017"
              echo "Exit code: $rc"
              echo
              cat /tmp/estructura-productiva.log
            } > diagnostico_estructura_productiva.txt
          fi
          exit 0

      - name: Verificar datos generados
        id: verificar
        if: steps.resolver.outputs.rc == '0' && steps.generar.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python verificar_estructura_productiva.py 2>&1 | tee /tmp/estructura-productiva-verificacion.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('deploy/site-overlay/assets/data/estructura-productiva/manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['periodo_rus']='2017'
          d['base_tipo']='stock_estructural'
          d['fuentes']['rus']['nombre']='Relevamiento Usos del Suelo 2017 · Buenos Aires Data'
          d['fuentes']['rus']['url']='https://data.buenosaires.gob.ar/dataset/juqdkmgo-180/resource/juqdkmgo-1807-resource'
          d['nota']='Base estructural RUS 2017, último recurso descargable validado con detalle ClaNAE y localización por manzana. La dinámica reciente se publica separadamente mediante habilitaciones AGC para no presentar un flujo administrativo como stock de establecimientos.'
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          else
            {
              echo "Fecha UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Commit: $GITHUB_SHA"
              echo "Fase: verificar RUS 2017"
              echo "Exit code: $rc"
              echo
              cat /tmp/estructura-productiva-verificacion.log
            } > diagnostico_estructura_productiva.txt
          fi
          exit 0

      - name: Commitear resultado o diagnóstico
        shell: bash
        run: |
          set -e
          git config user.name "cepoes-bot"
          git config user.email "actions@github.com"
          fallo=0
          if [ "${{ steps.resolver.outputs.rc }}" != "0" ] || [ "${{ steps.generar.outputs.rc }}" != "0" ] || [ "${{ steps.verificar.outputs.rc }}" != "0" ]; then fallo=1; fi
          if [ "$fallo" -eq 1 ]; then
            git add diagnostico_estructura_productiva.txt
            mensaje="territorio: diagnosticar estructura productiva $(date -u +%F)"
          else
            git add deploy/site-overlay/assets/data/estructura-productiva/
            if git ls-files --error-unmatch diagnostico_estructura_productiva.txt >/dev/null 2>&1; then git rm diagnostico_estructura_productiva.txt; fi
            mensaje="territorio: actualizar base estructural RUS 2017 $(date -u +%F)"
          fi
          if git diff --cached --quiet; then [ "$fallo" -eq 0 ] && exit 0 || exit 1; fi
          git commit -m "$mensaje"
          push_ok=0
          for intento in 1 2 3; do
            if git push; then push_ok=1; break; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || exit 1
            sleep 3
          done
          [ "$push_ok" -eq 1 ] || exit 1
          [ "$fallo" -eq 0 ] && exit 0 || exit 1
