name: Explorar radios Censo 2022

on:
  push:
    paths:
      - "explorar_radios_censo2022.py"
      - ".github/workflows/explorar-radios-censo2022.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias geoespaciales
        run: pip install requests geopandas pyogrio
      - name: Inspeccionar radios censales 2022
        run: python explorar_radios_censo2022.py
      - name: Mostrar diagnóstico
        run: cat diagnostico_radios_2022.json
