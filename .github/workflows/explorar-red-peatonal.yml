name: Explorar red peatonal CABA

on:
  push:
    paths:
      - "explorar_red_peatonal_osm.py"
      - ".github/workflows/explorar-red-peatonal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restaurar caché peatonal
        uses: actions/cache@v4
        with:
          path: |
            _cache/caba-walk.graphml
            _cache/osmnx
          key: caba-walk-osm-v1

      - name: Instalar OSMnx
        run: pip install "osmnx==2.1.1"

      - name: Construir o restaurar red peatonal
        run: python explorar_red_peatonal_osm.py

      - name: Mostrar diagnóstico
        run: cat diagnostico_red_peatonal.json
