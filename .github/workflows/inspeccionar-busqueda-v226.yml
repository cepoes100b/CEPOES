name: Inspeccionar buscador expedientes v2.26

on:
  pull_request:
    paths:
      - "inspeccionar_busqueda_expedientes.py"
      - ".github/workflows/inspeccionar-busqueda-v226.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Inspeccionar contrato oficial
        run: python inspeccionar_busqueda_expedientes.py
