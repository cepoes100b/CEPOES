name: Versionar capa pública inicial de sesiones

on:
  pull_request:
    paths:
      - ".github/workflows/inspeccionar-sesiones.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar capa pública de sesiones
        run: python actualizar_sesiones.py

      - name: Verificar capa pública de sesiones
        run: python verificar_sesiones.py

      - name: Versionar dataset inicial
        run: |
          git config user.name "cepoes-bot"
          git config user.email "actions@github.com"
          git add sesiones_publicas.json
          if git diff --cached --quiet; then
            echo "Dataset sin cambios"
            exit 0
          fi
          git commit -m "legislatura: datos iniciales de sesiones v2.24"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
