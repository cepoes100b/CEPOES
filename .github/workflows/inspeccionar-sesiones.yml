name: Validar capa pública de sesiones

on:
  pull_request:
    paths:
      - "actualizar_sesiones.py"
      - "verificar_sesiones.py"
      - "inspeccionar_sesiones_slp.py"
      - "sondear_datos_sesiones.py"
      - "sondear_votaciones_js.py"
      - ".github/workflows/inspeccionar-sesiones.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar capa pública de sesiones
        run: python actualizar_sesiones.py

      - name: Verificar capa pública de sesiones
        run: python verificar_sesiones.py

      - name: Inspeccionar formulario oficial de sesiones
        run: python inspeccionar_sesiones_slp.py

      - name: Sondear datos y página oficial de votaciones
        run: python sondear_datos_sesiones.py

      - name: Identificar servicios oficiales de votaciones
        run: python sondear_votaciones_js.py
