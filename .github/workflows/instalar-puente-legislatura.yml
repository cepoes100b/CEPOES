name: Instalar puente del Monitor Legislativo

on:
  push:
    branches: [main]
    paths:
      - "deploy/site-overlay/assets/legislatura-public-bridge.js"
      - ".github/workflows/instalar-puente-legislatura.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cepoes-instalar-puente-legislatura
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    environment: production

    env:
      SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
      SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
      SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
      REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}

    steps:
      - uses: actions/checkout@v5

      - name: Verificar configuración
        shell: bash
        run: |
          set -euo pipefail
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD REMOTE_DIR; do
            if [ -z "${!v:-}" ]; then
              echo "Falta $v" >&2
              exit 1
            fi
          done
          echo "SFTP_PORT=${SFTP_PORT:-65002}" >> "$GITHUB_ENV"

      - name: Instalar cliente SFTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Descargar módulo completo de Legislatura
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _patch/legislatura _patch/assets

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          mirror --verbose "$REMOTE_DIR/legislatura" "_patch/legislatura"
          bye
          EOF

          test -s _patch/legislatura/index.html
          cp deploy/site-overlay/assets/legislatura-public-bridge.js _patch/assets/

          echo "HTML descargados:"
          find _patch/legislatura -type f -name '*.html' -print

      - name: Inyectar puente en todas las páginas de Legislatura
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("_patch/legislatura")
          tag = '<script src="/assets/legislatura-public-bridge.js?v=20260827-2"></script>'

          html_files = sorted(root.rglob("*.html"))
          if not html_files:
              raise SystemExit("No se encontraron HTML bajo /legislatura/")

          injected = 0
          detail_candidates = 0

          for path in html_files:
              html = path.read_text(encoding="utf-8")

              if "Expediente no disponible" in html or "expediente no disponible" in html.lower():
                  detail_candidates += 1

              # Quitar cualquier versión anterior.
              html = re.sub(
                  r'<script\b[^>]*src=["\']/assets/legislatura-public-bridge\.js(?:\?[^"\']*)?["\'][^>]*></script>',
                  '',
                  html,
                  flags=re.I
              )

              updated, count = re.subn(
                  r'(<head\b[^>]*>)',
                  r'\1' + tag,
                  html,
                  count=1,
                  flags=re.I
              )
              if count != 1:
                  raise SystemExit(f"No se encontró <head> en {path}")

              path.write_text(updated, encoding="utf-8")
              injected += 1

          print(f"✓ puente inyectado en {injected} HTML")
          print(f"✓ páginas candidatas de detalle detectadas: {detail_candidates}")

          if injected < 2:
              raise SystemExit(
                  "Sólo se encontró un HTML en /legislatura/: "
                  "no se puede garantizar que la ficha individual haya quedado cubierta."
              )
          PY

      - name: Validar cobertura local
        shell: bash
        run: |
          set -euo pipefail

          TOTAL="$(find _patch/legislatura -type f -name '*.html' | wc -l)"
          BRIDGED="$(grep -RIl 'legislatura-public-bridge.js?v=20260827-2' _patch/legislatura --include='*.html' | wc -l)"

          echo "HTML totales: $TOTAL"
          echo "HTML con puente: $BRIDGED"

          test "$TOTAL" -eq "$BRIDGED"
          test "$TOTAL" -ge 2
          grep -q '__CEPOES_LEGISLATURA_PUBLIC_BRIDGE__' _patch/assets/legislatura-public-bridge.js

          echo "✓ todas las páginas legislativas usan el mismo puente"

      - name: Publicar módulo legislativo y puente
        shell: bash
        run: |
          set -euo pipefail

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          put -O "$REMOTE_DIR/assets" "_patch/assets/legislatura-public-bridge.js"
          mirror -R --verbose --no-perms --no-umask "_patch/legislatura" "$REMOTE_DIR/legislatura"
          bye
          EOF

      - name: Smoke test de producción
        shell: bash
        run: |
          set -euo pipefail
          Q="bridge=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"

          curl --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 45 \
            -fsS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://cepoes.org/legislatura/?$Q" \
            -o /tmp/legislatura.html

          grep -q 'legislatura-public-bridge.js?v=20260827-2' /tmp/legislatura.html

          curl --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 45 \
            -fsS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://cepoes.org/assets/legislatura-public-bridge.js?$Q" \
            -o /tmp/bridge.js

          grep -q '__CEPOES_LEGISLATURA_PUBLIC_BRIDGE__' /tmp/bridge.js

          echo "PRODUCCIÓN OK · puente v2 instalado en todo /legislatura/"
