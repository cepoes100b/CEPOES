name: Instalar Descentralizacion V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Instalar generador y verificador V2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          files = {
              "generar_descentralizacion_comunas.py": (
                  """""",
                  "d2bead641bb16998ea216c3e5b25d13d1285b0c65ed882291f914e4c5626be20",
              ),
              "verificar_descentralizacion_comunas.py": (
                  """""",
                  "5cc5b331fd0660dfdecbc88fc0d2d6fbe28efb04706f688c3211029447a6a895",
              ),
          }
          for path, (payload_b64, expected) in files.items():
              payload = base64.b64decode(payload_b64)
              actual = hashlib.sha256(payload).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Hash inválido {path}")
              Path(path).write_bytes(payload)
              print(f"✓ {path} · {len(payload)} bytes · {actual}")
          PY

      - name: Validar sintaxis
        run: |
          python -m py_compile generar_descentralizacion_comunas.py
          python -m py_compile verificar_descentralizacion_comunas.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add generar_descentralizacion_comunas.py verificar_descentralizacion_comunas.py
          if git diff --cached --quiet; then
            echo "Sin cambios: V2 ya instalada."
          else
            git commit -m "fix: validar presupuesto comunal con Decreto 2026"
            git push origin HEAD:main
          fi

      - name: Confirmar
        run: |
          grep -n "cepoes-descentralizacion-comunas-v2" generar_descentralizacion_comunas.py verificar_descentralizacion_comunas.py
          echo "✓ Descentralización V2 instalada en main"
