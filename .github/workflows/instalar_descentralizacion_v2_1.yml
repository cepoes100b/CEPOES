name: Instalar Descentralizacion V2.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Instalar parser monetario V2.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          payload = base64.b64decode("""""")
          expected = "68e26fa56278cd23e24226a49b6a2d1caeff8ba4a75d062c0e1061ca545da1a8"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"Hash inválido: {actual} != {expected}")

          p = Path("generar_descentralizacion_comunas.py")
          p.write_bytes(payload)
          print("✓ generador V2.1 instalado")
          print("✓ sha256:", actual)
          PY

      - name: Validar sintaxis y parser
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile generar_descentralizacion_comunas.py
          python - <<'PY'
          import generar_descentralizacion_comunas as g

          tests = {
              "398.992.769": 398992769.0,
              "1.234.567,89": 1234567.89,
              "1,234,567.89": 1234567.89,
              "1234567,89": 1234567.89,
          }
          for raw, expected in tests.items():
              actual = g.fnum(raw)
              if abs(actual - expected) > 0.001:
                  raise SystemExit(f"Parser incorrecto {raw} -> {actual}")
              print(f"✓ {raw} -> {actual}")
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add generar_descentralizacion_comunas.py
          if git diff --cached --quiet; then
            echo "Sin cambios: V2.1 ya instalada."
          else
            git commit -m "fix: parsear importes BA Data con separador de miles"
            git push origin HEAD:main
          fi

      - name: Confirmar
        run: |
          grep -n "Descentralización comunal V2.1" generar_descentralizacion_comunas.py
          echo "✓ Descentralización V2.1 instalada en main"
