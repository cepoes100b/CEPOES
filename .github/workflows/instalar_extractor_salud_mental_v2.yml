name: Instalar extractor Salud Mental V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Instalar V2 exacta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          payload = base64.b64decode("""""")
          expected = "f3ae55e2f4045256a8a6220037265ae181766d778a4ab410a934ed679e420894"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"Hash inválido: {actual} != {expected}")

          p = Path("actualizar_salud_mental.py")
          p.write_bytes(payload)

          text = p.read_text(encoding="utf-8")
          assert "DEIS {inferred_year}:" in text
          assert "top residencia en suicidios" in text
          assert len(text.splitlines()) == 400

          print("✓ actualizar_salud_mental.py reemplazado")
          print("✓ líneas:", len(text.splitlines()))
          print("✓ sha256:", actual)
          PY

      - name: Validar sintaxis
        run: python -m py_compile actualizar_salud_mental.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add actualizar_salud_mental.py

          if git diff --cached --quiet; then
            echo "Sin cambios: la V2 ya estaba instalada."
          else
            git commit -m "fix: extractor salud mental V2"
            git push origin HEAD:main
          fi

      - name: Confirmar instalación
        shell: bash
        run: |
          set -euo pipefail
          echo "Versión instalada:"
          wc -l actualizar_salud_mental.py
          grep -n "top residencia en suicidios" actualizar_salud_mental.py
          echo "✓ Salud Mental V2 instalada en main"
