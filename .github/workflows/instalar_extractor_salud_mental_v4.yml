name: Instalar extractor Salud Mental V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Instalar V4 exacta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          payload = base64.b64decode("""""")
          expected = "dd83681cad49b82cb1ef93d5030f8e52a4ac25f4a6cbebe1d3d2db04937cfad3"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"Hash inválido: {actual} != {expected}")

          p = Path("actualizar_salud_mental.py")
          p.write_bytes(payload)

          text = p.read_text(encoding="utf-8")
          assert "filas_suicidio" in text
          assert "suicidios_sumados" in text
          assert "caba_count_samples" in text

          print("✓ actualizar_salud_mental.py reemplazado por V4")
          print("✓ líneas:", len(text.splitlines()))
          print("✓ sha256:", actual)
          PY

      - name: Validar sintaxis
        run: python -m py_compile actualizar_salud_mental.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add actualizar_salud_mental.py

          if git diff --cached --quiet; then
            echo "Sin cambios: V4 ya instalada."
          else
            git commit -m "debug: validar cantidades DEIS salud mental"
            git push origin HEAD:main
          fi

      - name: Confirmar
        shell: bash
        run: |
          set -euo pipefail
          grep -n "filas_suicidio" actualizar_salud_mental.py
          grep -n "suicidios_sumados" actualizar_salud_mental.py
          echo "✓ Salud Mental V4 instalada en main"
