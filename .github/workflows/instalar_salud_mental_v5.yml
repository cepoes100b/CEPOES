name: Instalar Salud Mental V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Instalar extractor y verificador V5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          files = {
              "actualizar_salud_mental.py": (
                  """""",
                  "863e5178ab133cfb30bf685ca0dd42233f5eb58da0224a7951c5a8dc75c2c7f5",
              ),
              "verificar_salud_mental.py": (
                  """""",
                  "268ec67d9c0b17eb7855de86a7fdd6884ff8c6764d322e034d98cb1c130fdb7b",
              ),
          }

          for path, (payload_b64, expected) in files.items():
              payload = base64.b64decode(payload_b64)
              actual = hashlib.sha256(payload).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Hash inválido {path}: {actual} != {expected}")
              Path(path).write_bytes(payload)
              print(f"✓ {path} · {len(payload)} bytes · {actual}")
          PY

      - name: Validar sintaxis
        run: |
          python -m py_compile actualizar_salud_mental.py
          python -m py_compile verificar_salud_mental.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add actualizar_salud_mental.py verificar_salud_mental.py

          if git diff --cached --quiet; then
            echo "Sin cambios: V5 ya instalada."
          else
            git commit -m "fix: separar DEIS nacional y SNIC CABA en salud mental"
            git push origin HEAD:main
          fi

      - name: Confirmar
        run: |
          grep -n "cepoes-salud-mental-v2" actualizar_salud_mental.py verificar_salud_mental.py
          echo "✓ Salud Mental V5 instalada en main"
