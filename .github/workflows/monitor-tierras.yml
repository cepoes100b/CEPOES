name: Detectar cambios en fuentes de tierras
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-tierras
  cancel-in-progress: false
jobs:
  detectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: monitor-tierras
          key: tierras-${{ github.run_id }}
          restore-keys: tierras-
      - name: Verificar datos y monitor
        run: |
          python scripts/verificar_tierras.py
          python scripts/test_monitor_tierras.py
      - name: Consultar fuentes y preservar documentos
        run: python scripts/monitor_tierras.py --output monitor-tierras
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: monitor-tierras
          key: tierras-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuentes-tierras-${{ github.run_id }}
          path: monitor-tierras
          retention-days: 30
