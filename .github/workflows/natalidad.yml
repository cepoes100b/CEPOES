name: Actualizar natalidad y demografía
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'actualizar_natalidad.py'
      - 'verificar_natalidad.py'
      - 'deploy/site-overlay/assets/data/natalidad.json'
      - 'deploy/site-overlay/assets/natalidad.js'
      - 'deploy/site-overlay/observatorio/natalidad/**'
      - '.github/workflows/natalidad.yml'
  schedule:
    - cron: '33 10 7 * *'
permissions:
  contents: write
concurrency:
  group: cepoes-natalidad-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python actualizar_natalidad.py
      - run: python verificar_natalidad.py
      - name: Guardar último dato validado
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add natalidad.json deploy/site-overlay/assets/data/natalidad.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "datos: actualizar natalidad" -m "$(python deploy/registrar_actualizacion.py trailers)"
          push_ok=0
          for intento in 1 2 3; do
            if git push; then
              python deploy/registrar_actualizacion.py post-push
              push_ok=1
              break
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          [ "$push_ok" -eq 1 ] || exit 1
