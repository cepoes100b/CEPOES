name: Distribuir novedades CEPOES
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cepoes-newsletter
  cancel-in-progress: false
jobs:
  distribuir:
    if: vars.NEWSLETTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Actualizar catálogo y procesar solo difusión aprobada
        env:
          NEWSLETTER_DISPATCH_SECRET: ${{ secrets.NEWSLETTER_DISPATCH_SECRET }}
        run: python scripts/dispatch_newsletter.py
