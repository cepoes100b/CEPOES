name: Actualizar Personas Mayores
on:
  schedule:
    - cron: "25 13 * * *"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["actualizar_personas_mayores.py","verificar_personas_mayores.py","test_personas_mayores.py","fixtures/defensoria_*",".github/workflows/personas-mayores.yml","deploy/site-overlay/observatorio/personas-mayores/**","deploy/site-overlay/assets/personas-mayores.*","deploy/site-overlay/assets/data/personas-mayores.json"]
  pull_request:
    branches: [main]
    paths: ["actualizar_personas_mayores.py","verificar_personas_mayores.py","test_personas_mayores.py","fixtures/defensoria_*",".github/workflows/personas-mayores.yml","deploy/site-overlay/observatorio/personas-mayores/**","deploy/site-overlay/assets/personas-mayores.*","deploy/site-overlay/assets/data/personas-mayores.json"]
permissions:
  contents: write
concurrency: {group: "personas-mayores-${{ github.ref }}", cancel-in-progress: false}
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Probar detector y coherencia de la página sin red
        run: python -m unittest -v test_personas_mayores
      - run: python actualizar_personas_mayores.py
      - run: python verificar_personas_mayores.py
      - name: Commitear sólo si cambió un dato validado
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@github.com"
          git add deploy/site-overlay/assets/data/personas-mayores.json deploy/site-overlay/observatorio/personas-mayores/index.html
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "personas mayores: actualización automática $(date -u +%F)" -m "$(python deploy/registrar_actualizacion.py trailers)"
          push_ok=0
          for intento in 1 2 3; do
            if git push; then
              python deploy/registrar_actualizacion.py post-push
              push_ok=1
              break
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          [ "$push_ok" -eq 1 ] || exit 1
