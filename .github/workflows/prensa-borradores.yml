name: Preparar borradores de prensa
on:
  workflow_dispatch:
  push:
    paths:
      - "generar_borradores_prensa.py"
      - "deploy/site-overlay/assets/data/migraciones.json"
      - "deploy/site-overlay/assets/data/deporte-accesibilidad-peatonal.json"
      - "deploy/site-overlay/assets/data/estructura-productiva/**"
      - "datos/endeudamiento/**"
      - ".github/workflows/prensa-borradores.yml"
  schedule:
    - cron: "35 13 * * *"
permissions:
  contents: read
  id-token: write
concurrency:
  group: prensa-borradores
  cancel-in-progress: true
jobs:
  generar:
    runs-on: ubuntu-latest
    env:
      PRESS_DRAFT_FUNCTION_URL: https://nriexnijkjamrmfivfmd.supabase.co/functions/v1/press-draft-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar y guardar borradores privados
        run: python generar_borradores_prensa.py
