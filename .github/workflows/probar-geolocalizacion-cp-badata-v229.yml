name: Probar geolocalización CP con BA Data v2.29

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: probar-geolocalizacion-cp-badata-v229
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Recuperar agregado CP ya calculado
        uses: actions/download-artifact@v4
        with:
          name: diagnostico-universo-territorial-integral-v229
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32600712276
      - name: Preparar entrada agregada
        run: |
          cp input/diagnostico_universo_territorial_integral.json ./diagnostico_universo_territorial_integral.json
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_universo_territorial_integral.json', encoding='utf-8'))
          assert x['privacidad']['microdatos_publicados'] is False
          assert x['privacidad']['identificadores_personales_en_salida'] is False
          assert len(x['agregado_cp_1000_1499']['filas']) > 300
          print('Entrada agregada:', len(x['agregado_cp_1000_1499']['filas']), 'CP')
          PY
      - name: Diagnosticar CP → barrio con APH oficial
        run: python diagnosticar_cp_barrio_aph.py
      - name: Validar diagnóstico
        run: |
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_cp_barrio_aph.json', encoding='utf-8'))
          assert x['privacidad']['microdatos_bcra_arca_leidos'] is False
          assert x['privacidad']['identificadores_personales_leidos'] is False
          assert x['fuente_aph']['filas_cp_barrio_validas'] >= 1000
          assert x['fuente_aph']['cp_distintos'] >= 30
          assert len(x['resultados']) == 2
          print(json.dumps(x['controles'], ensure_ascii=False, indent=2))
          print(json.dumps(x['resultados'], ensure_ascii=False, indent=2))
          PY
      - name: Publicar diagnóstico agregado
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-cp-barrio-aph-v229
          path: diagnostico_cp_barrio_aph.json
          if-no-files-found: error
          retention-days: 7
