name: Probar geolocalización CP contra Mapa de la Deuda v2.29

on:
  pull_request:
    branches:
      - endeudamiento-bcra-direct-v229
    paths:
      - probar_geolocalizacion_cp_mapadeladeuda.py
      - probar_geolocalizacion_cp_mapadeladeuda_v2.py
      - .github/workflows/probar-geolocalizacion-cp-mapadeladeuda-v229.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: probar-geolocalizacion-cp-mapadeladeuda-v229
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias livianas
        run: |
          python -m pip install --disable-pip-version-check requests pmtiles mapbox-vector-tile shapely

      - name: Recuperar agregado CP de la corrida integral
        uses: actions/download-artifact@v4
        with:
          name: diagnostico-universo-territorial-integral-v229
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32600712276

      - name: Preparar y validar entrada agregada
        run: |
          cp input/diagnostico_universo_territorial_integral.json ./diagnostico_universo_territorial_integral.json
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_universo_territorial_integral.json', encoding='utf-8'))
          assert x['privacidad']['microdatos_publicados'] is False
          assert x['privacidad']['identificadores_personales_en_salida'] is False
          assert len(x['agregado_cp_1000_1499']['filas']) > 300
          print('Entrada agregada:', len(x['agregado_cp_1000_1499']['filas']), 'CP')
          PY

      - name: Probar CP → GeoNames → barrios del PMTiles de Mapa
        run: python probar_geolocalizacion_cp_mapadeladeuda_v2.py

      - name: Validar diagnóstico
        run: |
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_geolocalizacion_cp_mapadeladeuda.json', encoding='utf-8'))
          assert x['privacidad']['microdatos_bcra_arca_leidos'] is False
          assert x['privacidad']['identificadores_personales_leidos'] is False
          assert len(x['resultados']) == 4
          assert x['fuentes']['geonames']['archivo_zip_leido'].lower().endswith('ar.txt')
          assert max(r['cp_asignados'] for r in x['resultados'].values()) >= 50
          assert max(r['cobertura_deudores_pct'] for r in x['resultados'].values()) >= 50
          assert max(r['barrios_con_datos'] for r in x['resultados'].values()) >= 20
          print(json.dumps(x['ranking_exploratorio'], ensure_ascii=False, indent=2))
          for m,r in x['resultados'].items():
              print(m, 'CP=', r['cp_asignados'], 'cobertura=', r['cobertura_deudores_pct'], 'barrios=', r['barrios_con_datos'])
          PY

      - name: Publicar diagnóstico agregado
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-geolocalizacion-cp-mapadeladeuda-v229
          path: diagnostico_geolocalizacion_cp_mapadeladeuda.json
          if-no-files-found: error
          retention-days: 7

      - name: Limpiar insumos externos
        if: always()
        run: rm -f geo_admin_argentina.pmtiles
