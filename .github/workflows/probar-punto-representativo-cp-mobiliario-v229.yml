name: Probar punto representativo CP Mobiliario v2.29

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: probar-punto-representativo-cp-mobiliario-v229
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias espaciales
        run: python -m pip install --disable-pip-version-check requests shapely openpyxl
      - name: Recuperar agregado CP ya calculado
        uses: actions/download-artifact@v4
        with:
          name: diagnostico-universo-territorial-integral-v229
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32600712276
      - name: Preparar entrada agregada
        run: |
          cp input/diagnostico_universo_territorial_integral.json ./diagnostico_universo_territorial_integral.json
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_universo_territorial_integral.json', encoding='utf-8'))
          assert x['privacidad']['microdatos_publicados'] is False
          assert x['privacidad']['identificadores_personales_en_salida'] is False
          assert len(x['agregado_cp_1000_1499']['filas']) > 300
          print('Entrada agregada:', len(x['agregado_cp_1000_1499']['filas']), 'CP')
          PY
      - name: Probar puntos representativos contra barrios oficiales
        run: python probar_punto_representativo_cp_mobiliario.py
      - name: Validar diagnóstico
        run: |
          python - <<'PY'
          import json
          x=json.load(open('diagnostico_punto_representativo_cp_mobiliario.json', encoding='utf-8'))
          assert x['privacidad']['microdatos_bcra_arca_leidos'] is False
          assert x['privacidad']['identificadores_personales_leidos'] is False
          assert x['fuente_barrios']['barrios'] == 48
          assert x['fuente_mobiliario']['cp_distintos'] >= 20
          assert len(x['resultados']) == 4
          print(json.dumps(x['controles'], ensure_ascii=False, indent=2))
          print(json.dumps(x['resultados'], ensure_ascii=False, indent=2))
          PY
      - name: Publicar diagnóstico agregado
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-punto-representativo-cp-mobiliario-v229
          path: diagnostico_punto_representativo_cp_mobiliario.json
          if-no-files-found: error
          retention-days: 7
