name: Actualizar salud mental

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 20 * *'

permissions:
  contents: write

concurrency:
  group: cepoes-salud-mental
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Diagnosticar versión del extractor
        shell: bash
        run: |
          set -euo pipefail
          echo "Commit: $GITHUB_SHA"
          echo "Líneas del extractor:"
          wc -l actualizar_salud_mental.py
          echo "Funciones TLS presentes:"
          grep -nE 'def (request_bytes|get_json)|SourceDownloadError' actualizar_salud_mental.py || true

      - name: Probar transporte seguro sin acceder a las fuentes
        run: python -m unittest test_salud_mental_tls.py

      - name: Generar salud mental con TLS verificado
        run: python actualizar_salud_mental.py

      - name: Verificar
        run: python verificar_salud_mental.py

      - name: Mostrar resultado resumido
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("salud_mental.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          print("Archivo generado:", p)
          print("Claves superiores:", ", ".join(data.keys()))

          # Salida tolerante a pequeños cambios de esquema.
          for key in ("actualizado", "generated_at", "periodo", "latest_year", "ultimo_anio"):
              if key in data:
                  print(f"{key}: {data[key]}")

          print("Tamaño bytes:", p.stat().st_size)
          PY

      - name: Guardar último dato validado
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add salud_mental.json deploy/site-overlay/assets/data/salud-mental.json

          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "datos: actualizar salud mental DEIS" -m "$(python deploy/registrar_actualizacion.py trailers)"
          push_ok=0
          for intento in 1 2 3; do
            if git push; then
              python deploy/registrar_actualizacion.py post-push
              push_ok=1
              break
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          [ "$push_ok" -eq 1 ] || exit 1
