name: Revisar salud reproductiva y PAEV
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'actualizar_salud_reproductiva.py'
      - 'verificar_salud_reproductiva.py'
      - 'deploy/site-overlay/assets/data/salud-reproductiva.json'
      - 'deploy/site-overlay/assets/salud-reproductiva.js'
      - 'deploy/site-overlay/observatorio/salud-reproductiva/**'
      - '.github/workflows/salud-reproductiva.yml'
  schedule:
    - cron: '17 11 * * 1'
permissions:
  contents: write
concurrency:
  group: cepoes-salud-reproductiva-${{ github.ref }}
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python actualizar_salud_reproductiva.py
      - run: python verificar_salud_reproductiva.py
      - name: Guardar estado validado
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add salud_reproductiva.json deploy/site-overlay/assets/data/salud-reproductiva.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "datos: revisar salud reproductiva PAEV" -m "$(python deploy/registrar_actualizacion.py trailers)"
          push_ok=0
          for intento in 1 2 3; do
            if git push; then
              python deploy/registrar_actualizacion.py post-push
              push_ok=1
              break
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          [ "$push_ok" -eq 1 ] || exit 1
