name: Sonda deuda BCRA v2.28

on:
  pull_request:
    branches: [main]
    paths:
      - 'sonda_bcra_deuda.py'
      - '.github/workflows/sonda-deuda-v228.yml'
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python sonda_bcra_deuda.py
