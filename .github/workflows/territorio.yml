name: Actualizar datos territoriales

on:
  push:
    paths:
      - "generar_deporte_salud.py"
      - "verificar_deporte_salud.py"
      - ".github/workflows/territorio.yml"
  schedule:
    # 15:10 de Buenos Aires, diez minutos después de la segunda corrida diaria
    # del observatorio. Estas fuentes cambian mucho menos seguido, pero la consulta
    # diaria permite levantar actualizaciones sin depender de una fecha fija.
    - cron: "10 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-territorio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar fuentes territoriales de BA Data
        run: python descargar_territorio.py
        continue-on-error: true

      - name: Descargar segunda ampliación de fuentes oficiales
        run: python descargar_oferta_extra_2.py
        continue-on-error: true

      - name: Descargar límites oficiales de barrios
        run: python descargar_limites_barrios.py

      - name: Generar territorio.json
        run: python generar_territorio_runner.py

      - name: Verificar territorio.json
        run: python verificar_territorio.py

      - name: Generar listados base de Oferta territorial
        run: python generar_equipamientos_runner.py

      - name: Verificar listados base
        run: python verificar_equipamientos.py

      - name: Generar Oferta territorial total
        run: python generar_oferta_total_runner.py

      - name: Verificar Oferta territorial total
        run: python verificar_oferta_total.py

      - name: Generar resumen territorial para radiografías y mapas
        run: python generar_resumen_territorial.py

      - name: Verificar resumen territorial
        run: python verificar_resumen_territorial.py

      - name: Generar Deporte y vida saludable
        run: python generar_deporte_salud.py

      - name: Verificar Deporte y vida saludable
        run: python verificar_deporte_salud.py

      - name: Commitear si cambió
        run: |
          git config user.name  "cepoes-bot"
          git config user.email "actions@github.com"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            git add territorio.json estado_territorio.json badata/ equipamientos/ deploy/site-overlay/assets/data/deporte-salud.json
          else
            # En ramas funcionales evitamos mezclar el refresco rutinario de todas
            # las fuentes con el diff del PR; solo materializamos el dataset nuevo.
            git add deploy/site-overlay/assets/data/deporte-salud.json
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "territorio: actualización automática $(date -u +%F)"
          for intento in 1 2 3; do
            if git push; then
              echo "Push OK (intento $intento)"
              exit 0
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || exit 1
            sleep 3
          done
          echo "No pude empujar después de 3 intentos"
          exit 1
