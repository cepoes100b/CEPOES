name: Validar accesibilidad visual

on:
  pull_request:
    paths:
      - "deploy/site-overlay/**/*.css"
      - "deploy/site-overlay/**/*.html"
      - "deploy/preparar_sitio_publico.py"
      - "validar_contraste_visual.py"
      - "datos.json"
      - "deploy/preparar_indicadores.py"
      - "deploy/validar_descargas_browser.sh"
      - "tests/verificar_indicadores_browser.cjs"
      - "test_preparar_indicadores.py"
      - ".github/workflows/validar-accesibilidad-visual.yml"
  push:
    branches: [main]
    paths:
      - "deploy/site-overlay/**/*.css"
      - "deploy/site-overlay/**/*.html"
      - "deploy/preparar_sitio_publico.py"
      - "validar_contraste_visual.py"
      - ".github/workflows/validar-accesibilidad-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrastes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validar tokens y contrastes críticos
        run: python validar_contraste_visual.py

  concordancia-indicadores:
    name: Concordancia HTML, CSV y respaldo en Chromium
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detectar cambios pertinentes a las fichas
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]] || ! git diff --quiet "$BASE_SHA" HEAD -- \
            datos.json deploy/preparar_indicadores.py deploy/preparar_sitio_publico.py \
            deploy/validar_descargas_browser.sh tests/verificar_indicadores_browser.cjs \
            test_preparar_indicadores.py .github/workflows/validar-accesibilidad-visual.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Instalar Chromium para pruebas aisladas
        if: steps.scope.outputs.run == 'true'
        run: |
          npm install --prefix /tmp/cepoes-indicadores-qa --no-save --ignore-scripts playwright@1.62.1
          /tmp/cepoes-indicadores-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Construir candidato puntual y verificarlo sin secretos
        if: steps.scope.outputs.run == 'true'
        env:
          PLAYWRIGHT_MODULE: /tmp/cepoes-indicadores-qa/node_modules/playwright
        run: |
          python -m unittest test_preparar_indicadores.py
          bash deploy/validar_descargas_browser.sh
