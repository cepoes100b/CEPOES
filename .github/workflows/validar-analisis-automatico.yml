name: Validar análisis legislativo automático

on:
  pull_request:
    paths:
      - "automatizar_analisis_legislativo.py"
      - "automatizar_analisis_legislativo_copilot.py"
      - "automatizar_analisis_legislativo_hardened.py"
      - "automatizar_analisis_legislativo_hardened_v2.py"
      - "automatizar_analisis_legislativo_v3.py"
      - "normativa_referencia_caba.json"
      - "verificar_analisis_automatico.py"
      - "requirements.txt"
      - ".github/workflows/analizar-legislatura.yml"
      - ".github/workflows/validar-analisis-automatico.yml"
      - "supabase/functions/legislative-analysis-ingest-v2/**"
      - "infra/supabase/004_analisis_legislativo_automatico.sql"
      - "infra/supabase/005_focus_analisis_rls.sql"
      - "infra/supabase/006_guardrails_analisis_automatico.sql"
      - "infra/supabase/007_analisis_legislativo_v3.sql"
      - "deploy/site-overlay/assets/legislativa-auto-ui.js"
      - "deploy/site-overlay/assets/legislativa-config.js"
      - "docs/ANALISIS-LEGISLATIVO-AUTOMATICO.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Instalar dependencias de análisis
        run: pip install -r requirements.txt
      - name: Compilar y validar estructura
        run: |
          python -m py_compile automatizar_analisis_legislativo.py automatizar_analisis_legislativo_copilot.py automatizar_analisis_legislativo_hardened.py automatizar_analisis_legislativo_hardened_v2.py automatizar_analisis_legislativo_v3.py verificar_analisis_automatico.py
          python -m json.tool normativa_referencia_caba.json >/dev/null
          node --check deploy/site-overlay/assets/legislativa-auto-ui.js
          python verificar_analisis_automatico.py
      - name: Probar Copilot CLI v3 si la credencial está configurada
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::notice::Self-test de Copilot pendiente: falta configurar COPILOT_GITHUB_TOKEN."
            exit 0
          fi
          npm install -g @github/copilot@latest
          python automatizar_analisis_legislativo_v3.py --self-test
