name: Validar análisis legislativo automático

on:
  pull_request:
    paths:
      - "automatizar_analisis_legislativo.py"
      - "automatizar_analisis_legislativo_copilot.py"
      - "automatizar_analisis_legislativo_hardened.py"
      - "automatizar_analisis_legislativo_hardened_v2.py"
      - "automatizar_analisis_legislativo_v3.py"
      - "automatizar_analisis_legislativo_v3_1.py"
      - "automatizar_analisis_legislativo_v3_2.py"
      - "automatizar_analisis_legislativo_v3_3.py"
      - "normativa_referencia_caba.json"
      - "test_copilot_cli_offline.py"
      - "qa/probar_copilot_cli_release.py"
      - "verificar_analisis_automatico.py"
      - "verificar_analisis_v3_1.py"
      - "verificar_analisis_v3_2.py"
      - "verificar_analisis_v3_3.py"
      - "requirements.txt"
      - ".github/workflows/analizar-legislatura.yml"
      - ".github/workflows/validar-analisis-automatico.yml"
      - "supabase/functions/legislative-analysis-ingest-v2/**"
      - "infra/supabase/004_analisis_legislativo_automatico.sql"
      - "infra/supabase/005_focus_analisis_rls.sql"
      - "infra/supabase/006_guardrails_analisis_automatico.sql"
      - "infra/supabase/007_analisis_legislativo_v3.sql"
      - "deploy/site-overlay/assets/legislativa-auto-ui.js"
      - "deploy/site-overlay/assets/legislativa-config.js"
      - "docs/ANALISIS-LEGISLATIVO-AUTOMATICO.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compilar y validar estructura
        run: |
          python -m py_compile automatizar_analisis_legislativo.py automatizar_analisis_legislativo_copilot.py automatizar_analisis_legislativo_hardened.py automatizar_analisis_legislativo_hardened_v2.py automatizar_analisis_legislativo_v3.py automatizar_analisis_legislativo_v3_1.py automatizar_analisis_legislativo_v3_2.py automatizar_analisis_legislativo_v3_3.py verificar_analisis_automatico.py verificar_analisis_v3_1.py verificar_analisis_v3_2.py verificar_analisis_v3_3.py
          python -m json.tool normativa_referencia_caba.json >/dev/null
          node --check deploy/site-overlay/assets/legislativa-auto-ui.js
          python verificar_analisis_automatico.py
          python verificar_analisis_v3_1.py
          python verificar_analisis_v3_2.py
          python verificar_analisis_v3_3.py
      - name: Verificar contrato de inferencia sin red ni credenciales
        run: python -m unittest test_copilot_cli_offline.py
      - name: Verificar release público Copilot, sólo versión y ayuda sin red
        run: timeout --kill-after=5s 5m python qa/probar_copilot_cli_release.py
