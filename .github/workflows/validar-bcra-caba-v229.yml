name: Validar agregado CABA BCRA v2.29

on:
  pull_request:
    branches:
      - endeudamiento-bcra-v228
    paths:
      - 'descargar_bcra_deudores.py'
      - 'procesar_bcra_caba.py'
      - '.github/workflows/validar-bcra-caba-v229.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-bcra-caba-v229
  cancel-in-progress: true

jobs:
  agregado-caba:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --disable-pip-version-check requests

      - name: Compilar herramientas
        run: python -m py_compile descargar_bcra_deudores.py procesar_bcra_caba.py

      - name: Descargar PADRON ARCA y DEUDORES BCRA
        run: python descargar_bcra_deudores.py PADRON DEUDORES

      - name: Procesar agregado CABA sin persistir microdatos
        run: python procesar_bcra_caba.py

      - name: Mostrar diagnóstico agregado
        run: cat diagnostico_bcra_caba.json

      - name: Publicar sólo diagnóstico agregado
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-bcra-caba-v229
          path: diagnostico_bcra_caba.json
          if-no-files-found: error
          retention-days: 7

      - name: Eliminar archivos crudos
        if: always()
        run: |
          rm -rf bcra_deudores
          rm -f *.part
