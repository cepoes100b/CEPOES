name: Validar fuente BCRA directa v2.29

on:
  pull_request:
    branches:
      - endeudamiento-bcra-v228
    paths:
      - 'descargar_bcra_deudores.py'
      - 'inspeccionar_bcra_deudores.py'
      - '.github/workflows/validar-bcra-direct-v229.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-bcra-direct-v229
  cancel-in-progress: true

jobs:
  inspeccionar-padron:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --disable-pip-version-check requests

      - name: Compilar herramientas BCRA
        run: python -m py_compile descargar_bcra_deudores.py inspeccionar_bcra_deudores.py

      - name: Descargar último PADRON BCRA
        run: python descargar_bcra_deudores.py PADRON

      - name: Inspeccionar estructura sin exponer datos personales
        run: |
          python inspeccionar_bcra_deudores.py --salida estado_bcra_deudores.json
          cat estado_bcra_deudores.json

      - name: Publicar diagnóstico estructural
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-bcra-padron-v229
          path: estado_bcra_deudores.json
          if-no-files-found: error
          retention-days: 7
