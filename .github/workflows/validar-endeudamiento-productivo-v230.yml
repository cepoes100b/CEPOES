name: Validar Endeudamiento productivo v2.30

on:
  workflow_dispatch:
  push:
    branches:
      - endeudamiento-productivo-v230
    paths:
      - detectar_novedad_bcra.py
      - procesar_endeudamiento_productivo.py
      - generar_endeudamiento_barrios.py
      - recalibrar_matriz_cp_barrio_productiva.py
      - .github/workflows/validar-endeudamiento-productivo-v230.yml
  pull_request:
    branches:
      - endeudamiento-universo-territorial-v229
    paths:
      - detectar_novedad_bcra.py
      - procesar_endeudamiento_productivo.py
      - generar_endeudamiento_barrios.py
      - recalibrar_matriz_cp_barrio_productiva.py
      - .github/workflows/validar-endeudamiento-productivo-v230.yml

permissions:
  contents: read

concurrency:
  group: validar-endeudamiento-productivo-v230
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --disable-pip-version-check requests numpy

      - name: Compilar
        run: |
          python -m py_compile descargar_bcra_deudores.py procesar_universo_territorial_integral.py reconstruir_matriz_cp_barrio.py procesar_endeudamiento_productivo.py recalibrar_matriz_cp_barrio_productiva.py generar_endeudamiento_barrios.py

      - name: Detectar período actual
        run: python detectar_novedad_bcra.py

      - name: Descargar PADRON
        shell: bash
        run: |
          set -euo pipefail
          for intento in 1 2 3; do
            python descargar_bcra_deudores.py PADRON || true
            A="$(find bcra_deudores -maxdepth 1 -type f -name '*PADRON.7Z' -print -quit 2>/dev/null || true)"
            if [ -n "$A" ] && 7z t "$A" >/dev/null; then break; fi
            rm -f bcra_deudores/*PADRON.7Z bcra_deudores/*PADRON.7Z.part 2>/dev/null || true
            if [ "$intento" -eq 3 ]; then exit 1; fi
            sleep $((intento * 15))
          done

      - name: Descargar DEUDORES
        shell: bash
        run: |
          set -euo pipefail
          for intento in 1 2 3; do
            python descargar_bcra_deudores.py DEUDORES || true
            A="$(find bcra_deudores -maxdepth 1 -type f -name '*DEUDORES.7Z' -print -quit 2>/dev/null || true)"
            if [ -n "$A" ] && 7z t "$A" >/dev/null; then break; fi
            rm -f bcra_deudores/*DEUDORES.7Z bcra_deudores/*DEUDORES.7Z.part 2>/dev/null || true
            if [ "$intento" -eq 3 ]; then exit 1; fi
            sleep $((intento * 15))
          done

      - name: Procesar base territorial productiva
        run: python procesar_endeudamiento_productivo.py

      - name: Verificar calidad demográfica
        run: |
          python - <<'PY'
          import json
          p=json.load(open('diagnostico_endeudamiento_productivo.json', encoding='utf-8'))
          q=p['calidad_demografica']
          assert q['cobertura_edad_pct'] >= 80, q
          assert q['franjas_edad_con_datos'] >= 7, q
          edades={r['franja_edad']: r['deudores'] for r in p['resumen_edad_territorial']}
          assert edades.get('desconocida', 0) < sum(edades.values()) * 0.20, edades
          print('Calidad etaria OK:', q)
          print('Distribución:', edades)
          PY

      - name: Recalibrar matriz sobre provincia 00 + CP4
        run: python recalibrar_matriz_cp_barrio_productiva.py

      - name: Exigir validación fuera de muestra
        run: |
          python - <<'PY'
          import json
          d=json.load(open('diagnostico_matriz_cp_barrio_productiva.json', encoding='utf-8'))
          assert d['estado'] == 'VALIDADA_CANDIDATA', d['estado']
          assert all(d['checks'].values()), d['checks']
          v=d['resultado_validacion']['modelo']
          assert v['tv_distance_media'] <= 0.10
          assert v['correlacion_media'] >= 0.90
          p=json.load(open('diagnostico_endeudamiento_productivo.json', encoding='utf-8'))
          c=p['cobertura_territorial_cp4_sobre_caba']
          assert c['deudores_pct'] >= 90
          assert c['deuda_total_pct'] >= 90
          print('Matriz candidata OK:', v)
          print('Cobertura:', c)
          PY

      - name: Generar JSON público compacto de prueba
        run: |
          mkdir -p datos/endeudamiento
          cp matriz_cp_barrio_productiva_candidata.json datos/endeudamiento/matriz_cp_barrio.json
          python generar_endeudamiento_barrios.py

      - name: Verificar 48 barrios, filtros, cobertura y fuente
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.load(open('datos/endeudamiento/manifest.json', encoding='utf-8'))
          p=m['ultimo_periodo']
          path=pathlib.Path('datos/endeudamiento')/f'{p}.json'
          x=json.load(open(path, encoding='utf-8'))
          assert x['schema'] == 'cepoes-endeudamiento-barrios-v2-compact'
          assert len(x['barrios']) == 48 and len(set(x['barrios'])) == 48
          assert len(x['segmentos'][0]['datos']) == 48
          assert x['metricas_segmento'] == ['deudores','personas_mora','deuda_total_pesos','deuda_mora_pesos']
          assert x['fuente']['principal'].startswith('Banco Central')
          assert 'Mapa de la Deuda' not in json.dumps(x, ensure_ascii=False)
          edades={s['filtros']['edad'] for s in x['segmentos'] if s['filtros']['edad'] is not None}
          esperadas={'le25','26_35','36_45','46_55','56_65','66_75','gt75'}
          assert esperadas <= edades, (esperadas, edades)
          assert len(x['segmentos']) > 50, len(x['segmentos'])
          soporte=x['metodologia']['soporte_cp4']
          assert soporte['cp4_con_soporte'] >= 250
          assert soporte['cp4_sin_soporte'] > 0
          c=x['caba']['cobertura_mapa_sobre_caba']
          assert c['deudores_pct'] >= 90 and c['deuda_total_pct'] >= 90, c
          assert path.stat().st_size < 400_000, path.stat().st_size
          print('Salida pública de prueba:', p, '·', len(x['segmentos']), 'segmentos ·', path.stat().st_size, 'bytes · cobertura:', c)
          PY

      - name: Publicar diagnósticos y salida candidata
        uses: actions/upload-artifact@v4
        with:
          name: endeudamiento-productivo-v230
          path: |
            novedad_bcra.json
            diagnostico_endeudamiento_productivo.json
            diagnostico_matriz_cp_barrio_productiva.json
            matriz_cp_barrio_productiva_candidata.json
            datos/endeudamiento/manifest.json
            datos/endeudamiento/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Destruir crudos
        if: always()
        run: rm -rf bcra_deudores
