name: Validar fuente de endeudamiento v2.28

on:
  pull_request:
    branches: [main]
    paths:
      - 'verificar_fuente_endeudamiento.py'
      - 'V228.md'
      - '.github/workflows/validar-endeudamiento-v228.yml'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia HTTP
        run: pip install requests
      - name: Compilar verificador
        run: python -m py_compile verificar_fuente_endeudamiento.py
      - name: Verificar contrato público agregado de CABA
        run: python verificar_fuente_endeudamiento.py
