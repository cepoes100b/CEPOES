name: Validar núcleo legislativo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validar-legislatura-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Actualizar agenda y expedientes oficiales
        run: python actualizar_legislatura.py
      - name: Enriquecer fichas y ciclo oficial
        run: python enriquecer_expedientes.py
      - name: Completar hitos desde evidencia oficial
        run: python completar_ciclo_legislativo.py
      - name: Verificar núcleo legislativo
        run: python verificar_legislatura.py
      - name: Verificar ciclo legislativo
        run: python verificar_ciclo_legislativo.py
      - name: Commitear resultado validado si cambió
        run: |
          git config user.name "cepoes-bot"
          git config user.email "actions@github.com"
          git add legislatura_publica.json estado_legislatura.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "legislatura: validación ciclo $(date -u +%F-%H%M)"
          git push
