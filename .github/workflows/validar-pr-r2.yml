name: R2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: controles obligatorios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Ejecutar controles universales
        env:
          R2_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python validar_pr_r2.py

      - name: Verificar novedades automáticas
        run: |
          python -m unittest test_lo_nuevo.py test_catalogo_informes.py
          python generar_catalogo_informes.py deploy/site-overlay --check-source


      - name: Verificar cadena segura de actualización a publicación
        run: python -m unittest test_cadena_publicacion.py test_endeudamiento_publico.py

      - name: Verificar parser de panorama actual sin red
        run: |
          pip install "requests>=2.31" "openpyxl>=3.1" pypdf
          python -m unittest test_estructura_actual.py

      - name: Verificar transporte TLS y conservación de Salud Mental
        run: python -m unittest test_salud_mental_tls.py

      - name: Instalar Apache de referencia sin servicio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apache2-bin

      - name: Probar caché pública y DirectoryIndex en loopback
        run: python test_cache_publicacion_apache.py --repo . --output /tmp/cepoes-apache-cache-result.json

      - name: Comprobar endpoint público del marcador sin secretos
        run: |
          python - <<'PYMARKER'
          import sys, time
          sys.path.insert(0, 'deploy')
          from evidencia_publicacion import fetch_marker
          marker = fetch_marker('cepoes100b/CEPOES', f'ci-{time.time_ns()}')
          print('Marcador legacy ausente (HTTP 404)' if marker is None else 'Marcador válido: ' + marker['commit_sha'])
          PYMARKER
