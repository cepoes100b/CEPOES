name: R2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: controles obligatorios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Ejecutar controles universales
        env:
          R2_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python validar_pr_r2.py
