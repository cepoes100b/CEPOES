name: Validar Observatorio Presupuestario

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validar-presupuesto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar presupuesto oficial más reciente
        run: python descargar_presupuesto.py

      - name: Generar resumen presupuestario
        run: python generar_presupuesto.py

      - name: Verificar resumen presupuestario
        run: python verificar_presupuesto.py

      - name: Generar capa analítica
        run: python generar_presupuesto_analitico.py

      - name: Verificar capa analítica
        run: python verificar_presupuesto_analitico.py

      - name: Generar serie histórica trimestral
        run: python generar_presupuesto_historico.py

      - name: Verificar serie histórica trimestral
        run: python verificar_presupuesto_historico.py

      - name: Generar cruce presupuesto y territorio
        run: python generar_presupuesto_territorial.py

      - name: Verificar cruce presupuesto y territorio
        run: python verificar_presupuesto_territorial.py

      - name: Generar diagnóstico presupuestario
        run: python generar_diagnostico_presupuestario.py

      - name: Verificar diagnóstico presupuestario
        run: python verificar_diagnostico_presupuestario.py

      - name: Commitear resultado validado si cambió
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cepoes-bot"
          git config user.email "actions@github.com"
          git add presupuesto.json estado_presupuesto.json presupuesto_analitico.json presupuesto_historico.json presupuesto_territorial.json diagnostico_presupuestario.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "presupuesto: validación diagnóstica $(date -u +%F)" -m "$(python deploy/registrar_actualizacion.py trailers)"
          push_ok=0
          for intento in 1 2 3; do
            if git push; then
              python deploy/registrar_actualizacion.py post-push
              push_ok=1
              break
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          [ "$push_ok" -eq 1 ] || exit 1
