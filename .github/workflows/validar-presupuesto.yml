name: Validar Observatorio Presupuestario

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validar-presupuesto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar presupuesto oficial más reciente
        run: python descargar_presupuesto.py

      - name: Generar resumen presupuestario
        run: python generar_presupuesto.py

      - name: Verificar resumen presupuestario
        run: python verificar_presupuesto.py

      - name: Commitear resultado validado si cambió
        run: |
          git config user.name "cepoes-bot"
          git config user.email "actions@github.com"
          git add presupuesto.json estado_presupuesto.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "presupuesto: validación automática $(date -u +%F)"
          git push
